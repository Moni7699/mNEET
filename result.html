<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>mNEET - Result</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050b18;
            color: white;
            font-family: Arial, sans-serif;
        }

        .result-page {
            min-height: 100vh;
            padding-bottom: 35px;
        }

        .result-header {
            padding: 14px 16px;

            display: flex;
            align-items: center;
            gap: 14px;

            background: #050d1a;

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }

        .result-back {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 11px;

            background: #111a2c;
            color: white;

            font-size: 22px;

            cursor: pointer;
        }

        .result-brand {
            color: #ffc107;
            font-size: 21px;
            font-weight: 900;
        }

        .result-brand span {
            color: white;
        }

        .result-main {
            width: 100%;
            max-width: 850px;

            margin: auto;
            padding: 22px 15px;
        }

        .result-hero {
            padding: 28px 18px;

            text-align: center;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #10213b,
                    #07101f
                );

            border:
                1px solid
                rgba(255,193,7,0.18);
        }

        .result-icon {
            font-size: 45px;
        }

        .result-small {
            margin-top: 7px;

            color: #8997aa;

            font-size: 10px;
            font-weight: 900;

            letter-spacing: 1px;
        }

        .result-title {
            margin: 8px 0;

            color: white;
            font-size: 24px;
        }

        .result-score {
            margin-top: 14px;

            color: #ffc107;

            font-size: 50px;
            font-weight: 900;
        }

        .result-score-label {
            color: #8997aa;
            font-size: 12px;
        }

        .result-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 10px;

            margin-top: 15px;
        }

        .result-card {
            padding: 17px 8px;

            text-align: center;

            border-radius: 14px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,255,255,0.07);
        }

        .result-card-icon {
            font-size: 21px;
            margin-bottom: 7px;
        }

        .result-card-value {
            color: white;

            font-size: 21px;
            font-weight: 900;
        }

        .result-card-label {
            margin-top: 4px;

            color: #8997aa;
            font-size: 10px;
        }

        .accuracy-card {
            margin-top: 15px;

            padding: 18px;

            border-radius: 15px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,255,255,0.07);
        }

        .accuracy-top {
            display: flex;
            justify-content: space-between;

            margin-bottom: 10px;

            color: #c6d0dd;
            font-size: 13px;
        }

        .accuracy-top strong {
            color: #ffc107;
        }

        .accuracy-bar {
            height: 8px;

            overflow: hidden;

            border-radius: 20px;

            background: #18263c;
        }

        .accuracy-fill {
            width: 0%;
            height: 100%;

            border-radius: 20px;

            background: #ffc107;
        }

        .result-message {
            margin-top: 15px;

            padding: 15px;

            border-radius: 14px;

            text-align: center;

            background:
                rgba(255,193,7,0.06);

            border:
                1px solid
                rgba(255,193,7,0.12);

            color: #b9c4d2;

            font-size: 13px;
            line-height: 1.6;
        }

        .result-actions {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 10px;

            margin-top: 18px;
        }

        .result-button {
            min-height: 48px;

            border: 1px solid #2a3b55;

            border-radius: 11px;

            background: #0d192c;

            color: white;

            font-weight: 900;

            cursor: pointer;
        }

        .result-button.primary {
            background: #ffc107;
            border-color: #ffc107;
            color: #111;
        }

        .result-button:active {
            transform: scale(0.98);
        }

        @media (max-width: 600px) {

            .result-grid {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .result-actions {
                grid-template-columns: 1fr;
            }

        }
    </style>

</head>

<body>

<div class="result-page">

    <header class="result-header">

        <button
            class="result-back"
            onclick="goToTopic()">
            ←
        </button>

        <div class="result-brand">
            <span>m</span>NEET
        </div>

    </header>


    <main class="result-main">

        <section class="result-hero">

            <div class="result-icon">
                🏆
            </div>

            <div class="result-small">
                QUIZ COMPLETED
            </div>

            <h1
                id="resultTitle"
                class="result-title">
                Your Result
            </h1>

            <div
                id="score"
                class="result-score">
                0
            </div>

            <div class="result-score-label">
                Total Score
            </div>

        </section>


        <section class="result-grid">

            <div class="result-card">
                <div class="result-card-icon">✅</div>

                <div
                    id="correct"
                    class="result-card-value">
                    0
                </div>

                <div class="result-card-label">
                    Correct
                </div>
            </div>


            <div class="result-card">
                <div class="result-card-icon">❌</div>

                <div
                    id="incorrect"
                    class="result-card-value">
                    0
                </div>

                <div class="result-card-label">
                    Incorrect
                </div>
            </div>


            <div class="result-card">
                <div class="result-card-icon">⏭️</div>

                <div
                    id="skipped"
                    class="result-card-value">
                    0
                </div>

                <div class="result-card-label">
                    Skipped
                </div>
            </div>


            <div class="result-card">
                <div class="result-card-icon">⏱️</div>

                <div
                    id="time"
                    class="result-card-value">
                    00:00
                </div>

                <div class="result-card-label">
                    Time
                </div>
            </div>

        </section>


        <section class="accuracy-card">

            <div class="accuracy-top">

                <span>
                    Accuracy
                </span>

                <strong id="accuracy">
                    0%
                </strong>

            </div>

            <div class="accuracy-bar">

                <div
                    id="accuracyFill"
                    class="accuracy-fill">
                </div>

            </div>

        </section>


        <div
            id="resultMessage"
            class="result-message">

            Keep practicing and improve your score.

        </div>


        <section class="result-actions">

            <button
                class="result-button primary"
                onclick="reattemptQuiz()">

                🔄 Reattempt Quiz

            </button>


            <button
                class="result-button"
                onclick="goToTopic()">

                📚 Back to Topic

            </button>


            <button
                class="result-button"
                onclick="goToChapter()">

                📖 Back to Chapter

            </button>


            <button
                class="result-button"
                onclick="goToStudent()">

                🏠 Dashboard

            </button>

        </section>

    </main>

</div>


<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/result.js"></script>

</body>

</html>
