<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>mNEET - Result</title>

<link rel="stylesheet" href="css/style.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#050b18;
    color:white;
    font-family:Arial,sans-serif;
}

.result-page{
    min-height:100vh;
    padding-bottom:35px;
}

.result-header{
    padding:14px 16px;
    display:flex;
    align-items:center;
    gap:14px;
    background:#050d1a;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.result-back{
    width:42px;
    height:42px;
    border:0;
    border-radius:12px;
    background:#111a2c;
    color:white;
    font-size:23px;
    cursor:pointer;
}

.result-brand{
    font-size:21px;
    font-weight:900;
    color:#ffc107;
}

.result-brand span{
    color:white;
}

.result-main{
    width:100%;
    max-width:850px;
    margin:auto;
    padding:24px 15px;
}

.result-hero{
    padding:28px 20px;
    text-align:center;
    border-radius:22px;
    background:linear-gradient(145deg,#101f38,#07101f);
    border:1px solid rgba(255,193,7,.18);
}

.result-icon{
    font-size:45px;
}

.result-small{
    margin-top:8px;
    color:#8b99ad;
    font-size:11px;
    font-weight:800;
    letter-spacing:1px;
}

.result-title{
    color:white;
    font-size:24px;
    margin:8px 0;
}

.result-score{
    color:#ffc107;
    font-size:52px;
    font-weight:900;
    margin-top:14px;
}

.result-score-label{
    color:#8e9bae;
    font-size:12px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-top:18px;
}

.result-card{
    padding:17px 8px;
    text-align:center;
    border-radius:15px;
    background:#0d192c;
    border:1px solid rgba(255,255,255,.06);
}

.result-card-icon{
    font-size:21px;
    margin-bottom:7px;
}

.result-card-value{
    color:white;
    font-size:22px;
    font-weight:900;
}

.result-card-label{
    color:#8795a9;
    font-size:10px;
    margin-top:4px;
}

.accuracy-card{
    margin-top:18px;
    padding:20px;
    border-radius:17px;
    background:#0d192c;
    border:1px solid rgba(255,255,255,.06);
}

.accuracy-top{
    display:flex;
    justify-content:space-between;
    color:#c5cfdd;
    font-size:13px;
    margin-bottom:10px;
}

.accuracy-top strong{
    color:#ffc107;
}

.accuracy-bar{
    height:9px;
    overflow:hidden;
    border-radius:20px;
    background:#17253b;
}

.accuracy-fill{
    width:0%;
    height:100%;
    border-radius:20px;
    background:#ffc107;
    transition:.5s;
}

.result-message{
    margin-top:18px;
    padding:16px;
    border-radius:14px;
    text-align:center;
    background:rgba(255,193,7,.06);
    border:1px solid rgba(255,193,7,.13);
    color:#b8c3d2;
    font-size:13px;
    line-height:1.6;
}

.result-actions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.result-button{
    min-height:48px;
    border-radius:12px;
    border:1px solid #2b3c57;
    background:#0b172a;
    color:white;
    font-weight:800;
    cursor:pointer;
}

.result-button.primary{
    background:#ffc107;
    color:#171717;
    border-color:#ffc107;
}

@media(max-width:600px){

    .result-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .result-actions{
        grid-template-columns:1fr;
    }

}

</style>

</head>

<body>

<div class="result-page">

<header class="result-header">

<button
class="result-back"
onclick="goToTopic()"
>
←
</button>

<div class="result-brand">
<span>m</span>NEET
</div>

</header>


<main class="result-main">


<section class="result-hero">

<div class="result-icon">
🏆
</div>

<div class="result-small">
QUIZ COMPLETED
</div>

<h1
id="resultTitle"
class="result-title"
>
Your Result
</h1>

<div
id="score"
class="result-score"
>
0
</div>

<div class="result-score-label">
Total Score
</div>

</section>


<section class="result-grid">


<div class="result-card">

<div class="result-card-icon">
✅
</div>

<div
id="correct"
class="result-card-value"
>
0
</div>

<div class="result-card-label">
Correct
</div>

</div>


<div class="result-card">

<div class="result-card-icon">
❌
</div>

<div
id="incorrect"
class="result-card-value"
>
0
</div>

<div class="result-card-label">
Incorrect
</div>

</div>


<div class="result-card">

<div class="result-card-icon">
⏭️
</div>

<div
id="skipped"
class="result-card-value"
>
0
</div>

<div class="result-card-label">
Skipped
</div>

</div>


<div class="result-card">

<div class="result-card-icon">
⏱️
</div>

<div
id="time"
class="result-card-value"
>
00:00
</div>

<div class="result-card-label">
Time
</div>

</div>

</section>


<section class="accuracy-card">

<div class="accuracy-top">

<span>
Accuracy
</span>

<strong id="accuracy">
0%
</strong>

</div>

<div class="accuracy-bar">

<div
id="accuracyFill"
class="accuracy-fill"
></div>

</div>

</section>


<div
id="resultMessage"
class="result-message"
>
Keep practicing and improve your score.
</div>


<section class="result-actions">

<button
class="result-button primary"
onclick="reattemptQuiz()"
>
🔄 Reattempt Quiz
</button>

<button
class="result-button"
onclick="goToTopic()"
>
📚 Back to Topic
</button>

<button
class="result-button"
onclick="goToChapter()"
>
📖 Back to Chapter
</button>

<button
class="result-button"
onclick="goToStudent()"
>
🏠 Dashboard
</button>

</section>

</main>

</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/result.js"></script>

</body>

</html>
