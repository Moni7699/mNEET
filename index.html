<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - NEET Learning Platform</title>

    <!-- ============================= -->
    <!-- mNEET CSS -->
    <!-- ============================= -->

    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <!-- ============================= -->
    <!-- Firebase SDK -->
    <!-- ============================= -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>

</head>


<body>


<!-- ===================================== -->
<!-- MAIN AUTH PAGE -->
<!-- ===================================== -->

<div class="auth-page">


    <!-- ================================= -->
    <!-- AUTH CARD -->
    <!-- ================================= -->

    <div class="auth-card">


        <!-- ============================== -->
        <!-- LOGO -->
        <!-- ============================== -->

        <div class="logo-area">

            <div class="mneet-logo">

                <span class="logo-m">m</span><span class="logo-neet">NEET</span>

            </div>

            <div class="logo-subtitle">
                NEET Learning Platform
            </div>

        </div>


        <!-- ================================= -->
        <!-- LOGIN FORM -->
        <!-- ================================= -->

        <div
            id="loginBox"
            class="auth-section"
        >

            <h1>
                Welcome Back
            </h1>

            <p class="auth-description">
                Login and continue your NEET preparation.
            </p>


            <!-- Email -->

            <div class="input-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <!-- Login Button -->

            <button
                id="loginButton"
                class="primary-button"
                onclick="loginUser()"
            >

                Login

            </button>


            <!-- Switch Register -->

            <div class="switch-text">

                Don't have an account?

                <button
                    class="text-button"
                    onclick="showRegister()"
                >
                    Create Account
                </button>

            </div>

        </div>



        <!-- ================================= -->
        <!-- REGISTER FORM -->
        <!-- ================================= -->

        <div
            id="registerBox"
            class="auth-section hidden"
        >

            <h1>
                Create Account
            </h1>

            <p class="auth-description">
                Create your mNEET student account.
            </p>


            <!-- Name -->

            <div class="input-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                >

            </div>


            <!-- Email -->

            <div class="input-group">

                <label for="registerEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- Password -->

            <div class="input-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                >

            </div>


            <!-- Confirm Password -->

            <div class="input-group">

                <label for="registerConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="registerConfirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                >

            </div>


            <!-- Register Button -->

            <button
                id="registerButton"
                class="primary-button"
                onclick="registerUser()"
            >

                Create Account

            </button>


            <!-- Switch Login -->

            <div class="switch-text">

                Already have an account?

                <button
                    class="text-button"
                    onclick="showLogin()"
                >
                    Login
                </button>

            </div>

        </div>


        <!-- ================================= -->
        <!-- MESSAGE -->
        <!-- ================================= -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- ================================= -->
        <!-- LOADING -->
        <!-- ================================= -->

        <div
            id="authLoading"
            class="auth-loading hidden"
        >

            <div class="spinner"></div>

            <span>
                Please wait...
            </span>

        </div>


    </div>

</div>



<!-- ===================================== -->
<!-- FIREBASE CONFIG -->
<!-- ===================================== -->

<script src="js/firebase.js"></script>


<!-- ===================================== -->
<!-- AUTH JAVASCRIPT -->
<!-- ===================================== -->

<script src="js/auth.js"></script>


</body>

</html>
