<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Chapter</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <style>

        /* =====================================
           CHAPTER PAGE
           ===================================== */

        .chapter-page {
            min-height: 100vh;
            padding-bottom: 85px;
        }


        /* =====================================
           HEADER
           ===================================== */

        .chapter-header {

            position: sticky;

            top: 0;

            z-index: 50;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 13px 16px;

            background:
                rgba(4,10,21,0.96);

            backdrop-filter: blur(16px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

        }


        .header-left {

            display: flex;

            align-items: center;

            gap: 12px;

            min-width: 0;

        }


        .header-back {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.06);

            color: white;

            font-size: 21px;

            cursor: pointer;

        }


        .brand-logo {

            color: #ffc107;

            font-size: 21px;

            font-weight: 900;

        }


        .brand-logo span {

            color: white;

        }


        .header-logout {

            border: 1px solid
                rgba(255,255,255,0.10);

            background: transparent;

            color: #aab5c5;

            border-radius: 8px;

            padding: 8px 11px;

            font-size: 11px;

            font-weight: 800;

            cursor: pointer;

        }


        /* =====================================
           MAIN
           ===================================== */

        .chapter-main {

            width: 100%;

            max-width: 1000px;

            margin: auto;

            padding: 20px 15px;

        }


        /* =====================================
           HERO
           ===================================== */

        .chapter-hero {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 18px;

            padding: 21px;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    #10213b,
                    #07101f
                );

            border:
                1px solid
                rgba(255,193,7,0.15);

        }


        .hero-small {

            color: #ffc107;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

            margin-bottom: 6px;

        }


        .chapter-hero h1 {

            margin: 0 0 7px;

            color: white;

            font-size: 24px;

            line-height: 1.25;

        }


        .chapter-hero p {

            margin: 0;

            color: #8997aa;

            font-size: 12px;

            line-height: 1.5;

        }


        .hero-icon {

            width: 58px;

            height: 58px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 16px;

            background:
                rgba(255,193,7,0.08);

            font-size: 29px;

        }


        /* =====================================
           SECTION HEADING
           ===================================== */

        .section-heading {

            display: flex;

            align-items: center;

            justify-content: space-between;

            margin: 20px 2px 11px;

        }


        .section-heading h2 {

            margin: 0;

            color: white;

            font-size: 17px;

        }


        .section-heading span {

            color: #8492a7;

            font-size: 10px;

        }


        /* =====================================
           COMPACT TOPIC GRID
           ===================================== */

        .topic-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 11px;

        }


        /* =====================================
           TOPIC CARD
           ===================================== */

        .topic-card {

            display: flex;

            align-items: center;

            gap: 12px;

            min-height: 105px;

            padding: 12px;

            border-radius: 15px;

            background:
                linear-gradient(
                    145deg,
                    #101f35,
                    #0b1628
                );

            border:
                1px solid
                rgba(255,255,255,0.07);

            cursor: pointer;

            transition:
                transform .18s ease,
                border-color .18s ease;

        }


        .topic-card:hover {

            transform:
                translateY(-2px);

            border-color:
                rgba(255,193,7,0.28);

        }


        .topic-number {

            width: 43px;

            height: 43px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                rgba(255,193,7,0.09);

            border:
                1px solid
                rgba(255,193,7,0.17);

            color: #ffc107;

            font-size: 16px;

            font-weight: 900;

        }


        .topic-card-content {

            min-width: 0;

            flex: 1;

        }


        .topic-badge {

            color: #ffc107;

            font-size: 8px;

            font-weight: 900;

            letter-spacing: .7px;

            margin-bottom: 3px;

        }


        .topic-card-title {

            margin: 0 0 4px;

            color: white;

            font-size: 13px;

            font-weight: 900;

            line-height: 1.3;

        }


        .topic-card-description {

            margin: 0 0 7px;

            color: #7f8da2;

            font-size: 9px;

            line-height: 1.35;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;

        }


        .topic-open-label {

            color: #ffc107;

            font-size: 9px;

            font-weight: 900;

        }


        /* =====================================
           LOADING / EMPTY
           ===================================== */

        .chapter-loading {

            padding: 40px 15px;

            text-align: center;

            color: #8997aa;

            font-size: 12px;

        }


        .empty-state {

            padding: 40px 15px;

            text-align: center;

            border-radius: 15px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,255,255,0.06);

        }


        .empty-icon {

            font-size: 30px;

            margin-bottom: 8px;

        }


        .empty-state h3 {

            margin: 0 0 5px;

            color: white;

            font-size: 15px;

        }


        .empty-state p {

            margin: 0;

            color: #8492a7;

            font-size: 11px;

        }


        /* =====================================
           BOTTOM NAV
           ===================================== */

        .chapter-bottom-nav {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 60;

            display: flex;

            justify-content: space-around;

            padding: 8px 6px;

            background:
                rgba(4,10,21,0.97);

            border-top:
                1px solid
                rgba(255,255,255,0.07);

            backdrop-filter: blur(15px);

        }


        .bottom-item {

            flex: 1;

            border: none;

            background: transparent;

            color: #748197;

            padding: 5px;

            cursor: pointer;

        }


        .bottom-item span {

            display: block;

            font-size: 17px;

            margin-bottom: 2px;

        }


        .bottom-item small {

            font-size: 8px;

            font-weight: 800;

        }


        .bottom-item.active {

            color: #ffc107;

        }


        /* =====================================
           RESPONSIVE
           ===================================== */

        @media (max-width: 650px) {

            .topic-grid {

                grid-template-columns: 1fr;

            }


            .chapter-hero {

                padding: 18px;

            }


            .chapter-hero h1 {

                font-size: 21px;

            }

        }


        @media (min-width: 1000px) {

            .topic-grid {

                grid-template-columns:
                    repeat(3, minmax(0, 1fr));

            }

        }

    </style>

</head>


<body>


<div class="chapter-page">


    <!-- HEADER -->

    <header class="chapter-header">


        <div class="header-left">


            <button
                class="header-back"
                type="button"
                onclick="goBackToCourse()"
            >
                ←
            </button>


            <div class="brand-logo">

                <span>m</span>NEET

            </div>


        </div>


        <button
            class="header-logout"
            type="button"
            onclick="logoutUser()"
        >
            Logout
        </button>


    </header>



    <!-- MAIN -->

    <main class="chapter-main">


        <!-- HERO -->

        <section class="chapter-hero">


            <div>

                <div class="hero-small">

                    NEET BIOLOGY CHAPTER

                </div>


                <h1 id="chapterTitle">

                    Loading Chapter...

                </h1>


                <p id="chapterDescription">

                    Please wait...

                </p>

            </div>


            <div class="hero-icon">

                🧬

            </div>


        </section>



        <!-- TOPICS -->

        <div class="section-heading">


            <h2>

                Topics

            </h2>


            <span id="topicCount">

                0 Topics

            </span>


        </div>


        <section
            id="topicList"
            class="topic-grid"
        >

            <div class="chapter-loading">

                Loading topics...

            </div>

        </section>


    </main>



    <!-- BOTTOM NAV -->

    <nav class="chapter-bottom-nav">


        <button
            class="bottom-item"
            type="button"
            onclick="goBackToStudent()"
        >

            <span>🏠</span>

            <small>Home</small>

        </button>


        <button
            class="bottom-item active"
            type="button"
            onclick="goBackToCourse()"
        >

            <span>📝</span>

            <small>Practice</small>

        </button>


        <button
            class="bottom-item"
            type="button"
            onclick="openNCERT()"
        >

            <span>📖</span>

            <small>NCERT</small>

        </button>


        <button
            class="bottom-item"
            type="button"
            onclick="openVideos()"
        >

            <span>▶️</span>

            <small>Videos</small>

        </button>


    </nav>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/chapter.js"></script>


</body>

</html>
