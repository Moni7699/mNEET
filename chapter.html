<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Chapter</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

</head>


<body>


<div class="student-app">


    <!-- HEADER -->

    <header class="student-header">

        <div class="header-left">

            <button
                class="header-back"
                onclick="goBackToCourse()"
            >
                ←
            </button>

            <div class="brand-logo">
                <span>m</span>NEET
            </div>

        </div>


        <button
            class="header-logout"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </header>



    <!-- MAIN -->

    <main class="student-main">


        <!-- CHAPTER HERO -->

        <section class="student-hero">

            <div>

                <div class="hero-small">
                    NEET BIOLOGY CHAPTER
                </div>

                <h1 id="chapterTitle">
                    Loading Chapter...
                </h1>

                <p id="chapterDescription">
                    Please wait...
                </p>

            </div>


            <div class="hero-icon">
                🧬
            </div>

        </section>



        <!-- TOPICS -->

        <div class="section-heading">

            <h2>
                Topics
            </h2>

            <span id="topicCount">
                0 Topics
            </span>

        </div>


        <section
            id="topicList"
            class="course-grid"
        >

            <div class="course-loading">

                Loading topics...

            </div>

        </section>


    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">


        <button
            class="bottom-item"
            onclick="goBackToStudent()"
        >

            <span>🏠</span>

            <small>
                Home
            </small>

        </button>


        <button
            class="bottom-item active"
            onclick="goBackToCourse()"
        >

            <span>📝</span>

            <small>
                Practice
            </small>

        </button>


        <button
            class="bottom-item"
            onclick="openNCERT()"
        >

            <span>📖</span>

            <small>
                NCERT
            </small>

        </button>


        <button
            class="bottom-item"
            onclick="openVideos()"
        >

            <span>▶️</span>

            <small>
                Videos
            </small>

        </button>


    </nav>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/chapter.js"></script>


</body>

    </html>
