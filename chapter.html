<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>mNEET - Chapter</title>

<link
    rel="stylesheet"
    href="css/style.css"
>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


<style>

/* =====================================================
   BASE
===================================================== */

*{
    box-sizing:border-box;
}

body{

    margin:0;

    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #071226 0%,
            #050c1c 100%
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


/* =====================================================
   PAGE
===================================================== */

.chapter-page{

    min-height:100vh;

    padding-bottom:85px;
}


/* =====================================================
   HEADER
===================================================== */

.chapter-header{

    position:sticky;

    top:0;

    z-index:50;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:13px 16px;

    background:
        rgba(4,10,21,.97);

    backdrop-filter:blur(16px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}


.header-left{

    display:flex;

    align-items:center;

    gap:12px;

    min-width:0;
}


.header-back{

    width:38px;

    height:38px;

    border:none;

    border-radius:10px;

    background:
        rgba(255,255,255,.06);

    color:white;

    font-size:21px;

    cursor:pointer;
}


.brand-logo{

    color:#ffc107;

    font-size:21px;

    font-weight:900;
}


.brand-logo span{

    color:white;
}


.header-logout{

    border:
        1px solid
        rgba(255,255,255,.10);

    background:transparent;

    color:#aab5c5;

    border-radius:8px;

    padding:8px 11px;

    font-size:11px;

    font-weight:800;

    cursor:pointer;
}


/* =====================================================
   MAIN
===================================================== */

.chapter-main{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:20px 15px;
}


/* =====================================================
   HERO
===================================================== */

.chapter-hero{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:18px;

    padding:21px;

    border-radius:19px;

    background:
        linear-gradient(
            145deg,
            #10213b,
            #07101f
        );

    border:
        1px solid
        rgba(255,193,7,.15);
}


.hero-small{

    color:#ffc107;

    font-size:9px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:6px;
}


.chapter-hero h1{

    margin:0;

    color:white;

    font-size:24px;

    line-height:1.25;
}


.chapter-hero p{

    display:none;
}


.hero-icon{

    width:58px;

    height:58px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:16px;

    background:
        rgba(255,193,7,.08);

    font-size:29px;
}


/* =====================================================
   SECTION HEADING
===================================================== */

.section-heading{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:22px 2px 11px;
}


.section-heading h2{

    margin:0;

    color:white;

    font-size:17px;

    font-weight:900;
}


.section-heading span{

    color:#8492a7;

    font-size:10px;
}


/* =====================================================
   TOPIC LIST
   ONE CARD PER ROW
===================================================== */

.topic-grid{

    display:flex;

    flex-direction:column;

    gap:9px;
}


.topic-card{

    width:100%;

    min-height:62px;

    display:flex;

    align-items:center;

    gap:11px;

    padding:10px 12px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #101f35,
            #0b1628
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    transition:.18s;
}


.topic-card:hover{

    transform:translateY(-1px);

    border-color:
        rgba(255,193,7,.28);
}


.topic-number{

    width:38px;

    height:38px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:
        rgba(255,193,7,.09);

    border:
        1px solid
        rgba(255,193,7,.17);

    color:#ffc107;

    font-size:13px;

    font-weight:900;
}


.topic-card-content{

    min-width:0;

    flex:1;
}


.topic-badge{

    display:none;
}


.topic-card-title{

    margin:0;

    color:white;

    font-size:13px;

    font-weight:900;

    line-height:1.3;
}


.topic-card-description{

    display:none;
}


.topic-open-label{

    flex-shrink:0;

    color:#ffc107;

    font-size:9px;

    font-weight:900;
}


/* =====================================================
   QUESTION TYPE PRACTICE
   ONE CARD PER ROW
===================================================== */

.type-practice-list{

    display:flex;

    flex-direction:column;

    gap:9px;
}


.type-card{

    width:100%;

    min-height:62px;

    display:flex;

    align-items:center;

    gap:11px;

    padding:10px 12px;

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            #101f35,
            #0b1628
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    transition:.18s;
}


.type-card:hover{

    transform:translateY(-1px);

    border-color:
        rgba(255,193,7,.28);
}


.type-icon{

    width:38px;

    height:38px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:10px;

    background:
        rgba(255,193,7,.09);

    border:
        1px solid
        rgba(255,193,7,.17);

    font-size:18px;
}


.type-content{

    flex:1;

    min-width:0;
}


.type-title{

    margin:0;

    color:white;

    font-size:13px;

    font-weight:900;

    line-height:1.3;
}


.type-description{

    display:none;
}


.type-button{

    flex-shrink:0;

    min-width:65px;

    min-height:34px;

    border:none;

    border-radius:9px;

    background:#ffc107;

    color:#111827;

    font-size:10px;

    font-weight:900;

    cursor:pointer;
}


/* =====================================================
   LOADING / EMPTY
===================================================== */

.chapter-loading{

    width:100%;

    padding:35px 15px;

    text-align:center;

    color:#8997aa;

    font-size:12px;
}


.empty-state{

    padding:30px 15px;

    text-align:center;

    border-radius:14px;

    background:#0d192c;

    border:
        1px solid
        rgba(255,255,255,.06);
}


.empty-icon{

    font-size:28px;

    margin-bottom:7px;
}


.empty-state h3{

    margin:0 0 5px;

    color:white;

    font-size:14px;
}


.empty-state p{

    margin:0;

    color:#8492a7;

    font-size:10px;
}


/* =====================================================
   INFO
===================================================== */

.chapter-info{

    margin-top:20px;

    padding:15px 16px;

    border-radius:14px;

    background:
        rgba(255,193,7,.045);

    border:
        1px solid
        rgba(255,193,7,.13);

    color:#909eb1;

    font-size:11px;

    line-height:1.5;
}


.chapter-info strong{

    color:#ffc107;
}


/* =====================================================
   BOTTOM NAV
===================================================== */

.chapter-bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:60;

    display:flex;

    justify-content:space-around;

    padding:8px 6px;

    background:
        rgba(4,10,21,.97);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
}


.bottom-item{

    flex:1;

    border:none;

    background:transparent;

    color:#748197;

    padding:5px;

    cursor:pointer;
}


.bottom-item span{

    display:block;

    font-size:17px;

    margin-bottom:2px;
}


.bottom-item small{

    font-size:8px;

    font-weight:800;
}


.bottom-item.active{

    color:#ffc107;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .chapter-main{

        padding:
            16px 12px 35px;
    }


    .chapter-hero{

        padding:17px;

        border-radius:16px;
    }


    .chapter-hero h1{

        font-size:20px;
    }


    .hero-icon{

        width:48px;

        height:48px;

        border-radius:13px;

        font-size:24px;
    }


    .section-heading{

        margin-top:19px;

        margin-bottom:9px;
    }


    .section-heading h2{

        font-size:15px;
    }


    .topic-card,
    .type-card{

        min-height:58px;

        padding:9px 10px;

        border-radius:12px;
    }


    .topic-number,
    .type-icon{

        width:35px;

        height:35px;

        border-radius:9px;
    }


    .topic-card-title,
    .type-title{

        font-size:12px;
    }


    .topic-open-label{

        font-size:8px;
    }


    .type-button{

        min-width:58px;

        min-height:32px;

        font-size:9px;
    }

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .topic-card,
    .type-card{

        min-height:66px;

        padding:
            11px 14px;
    }

}


/* =====================================================
   IMPORTANT
   Hide old description elements if chapter.js
   creates them
===================================================== */

.topic-card-description,
.type-description{

    display:none !important;
}

</style>

</head>


<body>


<div class="chapter-page">


<!-- =====================================================
     HEADER
===================================================== -->

<header class="chapter-header">

    <div class="header-left">

        <button
            class="header-back"
            type="button"
            onclick="goBackToCourse()"
        >
            ←
        </button>


        <div class="brand-logo">

            <span>m</span>NEET

        </div>

    </div>


    <button
        class="header-logout"
        type="button"
        onclick="logoutUser()"
    >
        Logout
    </button>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="chapter-main">


<!-- =====================================================
     HERO
===================================================== -->

<section class="chapter-hero">

    <div>

        <div class="hero-small">

            NEET BIOLOGY CHAPTER

        </div>


        <h1 id="chapterTitle">

            Loading Chapter...

        </h1>


        <p id="chapterDescription">

            Please wait...

        </p>

    </div>


    <div class="hero-icon">

        🧬

    </div>

</section>



<!-- =====================================================
     TOPIC WISE — FIRST
===================================================== -->

<div class="section-heading">

    <h2>

        Topic Wise Practice

    </h2>


    <span id="topicCount">

        0 Topics

    </span>

</div>


<section
    id="topicList"
    class="topic-grid"
>

    <div class="chapter-loading">

        Loading topics...

    </div>

</section>



<!-- =====================================================
     CHAPTER WISE — SECOND
===================================================== -->

<div class="section-heading">

    <h2>

        Chapter Wise Practice

    </h2>


    <span>

        Question Types

    </span>

</div>


<section
    id="typePracticeGrid"
    class="type-practice-list"
>

    <div class="chapter-loading">

        Loading question types...

    </div>

</section>



<!-- =====================================================
     INFO
===================================================== -->

<div class="chapter-info">

    💡

    <strong>
        mNEET Practice:
    </strong>

    First practice topic-wise questions,
    then use different question types for
    exam-level preparation.

</div>


</main>



<!-- =====================================================
     BOTTOM NAV
===================================================== -->

<nav class="chapter-bottom-nav">


<button
    class="bottom-item"
    type="button"
    onclick="goBackToStudent()"
>

    <span>🏠</span>

    <small>Home</small>

</button>


<button
    class="bottom-item active"
    type="button"
    onclick="goBackToCourse()"
>

    <span>📝</span>

    <small>Practice</small>

</button>


<button
    class="bottom-item"
    type="button"
    onclick="openNCERT()"
>

    <span>📖</span>

    <small>NCERT</small>

</button>


<button
    class="bottom-item"
    type="button"
    onclick="openVideos()"
>

    <span>▶️</span>

    <small>Videos</small>

</button>


</nav>


</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/chapter.js"></script>


</body>

</html>
