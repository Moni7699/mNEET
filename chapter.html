<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>mNEET - Chapter</title>

<link
    rel="stylesheet"
    href="css/style.css"
>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


<style>

*{
    box-sizing:border-box;
}


body{

    margin:0;

    min-height:100vh;

    background:
        linear-gradient(
            180deg,
            #071226 0%,
            #050c1c 100%
        );

    color:white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}


.chapter-page{

    min-height:100vh;

    padding-bottom:85px;
}


/* ================= HEADER ================= */

.chapter-header{

    position:sticky;

    top:0;

    z-index:100;

    height:65px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 15px;

    background:
        rgba(4,10,21,.97);

    backdrop-filter:blur(15px);

    border-bottom:
        1px solid
        rgba(255,255,255,.07);
}


.header-left{

    display:flex;

    align-items:center;

    gap:10px;
}


.header-back{

    width:38px;

    height:38px;

    border:0;

    border-radius:10px;

    background:
        rgba(255,255,255,.07);

    color:white;

    font-size:21px;

    cursor:pointer;
}


.brand-logo{

    color:#ffc107;

    font-size:21px;

    font-weight:900;
}


.brand-logo span{

    color:white;
}


.header-logout{

    border:
        1px solid
        rgba(255,255,255,.10);

    background:transparent;

    color:#aab5c5;

    border-radius:8px;

    padding:7px 10px;

    font-size:10px;

    font-weight:800;
}


/* ================= MAIN ================= */

.chapter-main{

    width:100%;

    max-width:850px;

    margin:auto;

    padding:16px 13px 35px;
}


/* ================= HERO ================= */

.chapter-hero{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    padding:18px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #10213b,
            #07101f
        );

    border:
        1px solid
        rgba(255,193,7,.15);
}


.hero-small{

    color:#ffc107;

    font-size:8px;

    font-weight:900;

    letter-spacing:1px;

    margin-bottom:6px;
}


.chapter-hero h1{

    margin:0;

    color:white;

    font-size:22px;

    line-height:1.25;
}


.chapter-hero p{

    display:none;
}


.hero-icon{

    width:48px;

    height:48px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:13px;

    background:
        rgba(255,193,7,.08);

    font-size:24px;
}


/* ================= SECTION ================= */

.section-heading{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin:20px 2px 9px;
}


.section-heading h2{

    margin:0;

    color:white;

    font-size:16px;

    font-weight:900;
}


.section-heading span{

    color:#7f8da2;

    font-size:9px;

    font-weight:700;
}


/* ================= LIST ================= */

.topic-grid,
.type-practice-list{

    display:flex;

    flex-direction:column;

    gap:8px;
}


/* ================= TOPIC CARD ================= */

.topic-card{

    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:9px 11px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #101f35,
            #0b1628
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    transition:.18s;
}


.topic-card:hover{

    border-color:
        rgba(255,193,7,.28);

    transform:
        translateY(-1px);
}


.topic-number{

    width:35px;

    height:35px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,193,7,.09);

    border:
        1px solid
        rgba(255,193,7,.17);

    color:#ffc107;

    font-size:12px;

    font-weight:900;
}


.topic-card-content{

    flex:1;

    min-width:0;
}


.topic-card-title{

    margin:0;

    color:white;

    font-size:12px;

    font-weight:900;

    line-height:1.3;
}


.topic-card-description,
.topic-badge{

    display:none !important;
}


.topic-open-label{

    flex-shrink:0;

    color:#ffc107;

    font-size:8px;

    font-weight:900;
}


/* ================= TYPE CARD ================= */

.type-card{

    width:100%;

    min-height:58px;

    display:flex;

    align-items:center;

    gap:10px;

    padding:9px 11px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            #101f35,
            #0b1628
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    cursor:pointer;

    transition:.18s;
}


.type-card:hover{

    border-color:
        rgba(255,193,7,.28);

    transform:
        translateY(-1px);
}


.type-icon{

    width:35px;

    height:35px;

    flex-shrink:0;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:9px;

    background:
        rgba(255,193,7,.09);

    border:
        1px solid
        rgba(255,193,7,.17);

    font-size:17px;
}


.type-content{

    flex:1;

    min-width:0;
}


.type-title{

    margin:0;

    color:white;

    font-size:12px;

    font-weight:900;
}


.type-description{

    display:none !important;
}


.type-button{

    flex-shrink:0;

    min-width:58px;

    height:31px;

    border:0;

    border-radius:8px;

    background:#ffc107;

    color:#111827;

    font-size:9px;

    font-weight:900;

    cursor:pointer;
}


/* ================= LOADING ================= */

.chapter-loading{

    padding:30px 10px;

    text-align:center;

    color:#8997aa;

    font-size:11px;
}


/* ================= EMPTY ================= */

.empty-state{

    padding:25px 15px;

    text-align:center;

    border-radius:13px;

    background:#0d192c;

    border:
        1px solid
        rgba(255,255,255,.06);
}


.empty-icon{

    font-size:25px;

    margin-bottom:6px;
}


.empty-state h3{

    margin:0 0 4px;

    color:white;

    font-size:14px;
}


.empty-state p{

    margin:0;

    color:#8492a7;

    font-size:10px;
}


/* ================= INFO ================= */

.chapter-info{

    margin-top:19px;

    padding:13px 15px;

    border-radius:13px;

    background:
        rgba(255,193,7,.045);

    border:
        1px solid
        rgba(255,193,7,.13);

    color:#909eb1;

    font-size:10px;

    line-height:1.5;
}


.chapter-info strong{

    color:#ffc107;
}


/* ================= BOTTOM NAV ================= */

.chapter-bottom-nav{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:200;

    display:flex;

    justify-content:space-around;

    padding:7px 5px;

    background:
        rgba(4,10,21,.98);

    border-top:
        1px solid
        rgba(255,255,255,.07);

    backdrop-filter:blur(15px);
}


.bottom-item{

    flex:1;

    border:0;

    background:transparent;

    color:#748197;

    padding:4px;

    cursor:pointer;
}


.bottom-item span{

    display:block;

    font-size:16px;

    margin-bottom:2px;
}


.bottom-item small{

    font-size:8px;

    font-weight:800;
}


.bottom-item.active{

    color:#ffc107;
}


/* ================= DESKTOP ================= */

@media(min-width:700px){

    .chapter-main{

        padding-top:25px;
    }


    .topic-card,
    .type-card{

        min-height:62px;

        padding:
            10px 13px;
    }


    .topic-card-title,
    .type-title{

        font-size:13px;
    }

}

</style>

</head>


<body>


<div class="chapter-page">


<!-- ================= HEADER ================= -->

<header class="chapter-header">

    <div class="header-left">

        <button
            class="header-back"
            type="button"
            onclick="goBackToCourse()"
        >
            ←
        </button>


        <div class="brand-logo">

            <span>m</span>NEET

        </div>

    </div>


    <button
        class="header-logout"
        type="button"
        onclick="logoutUser()"
    >
        Logout
    </button>

</header>



<!-- ================= MAIN ================= -->

<main class="chapter-main">


<!-- HERO -->

<section class="chapter-hero">

    <div>

        <div class="hero-small">

            NEET BIOLOGY • CHAPTER

        </div>


        <h1 id="chapterTitle">

            Loading Chapter...

        </h1>


        <p id="chapterDescription">

            Please wait...

        </p>

    </div>


    <div class="hero-icon">

        🧬

    </div>

</section>



<!-- =================================================
     TOPIC WISE — FIRST
================================================= -->

<div class="section-heading">

    <h2>
        Topic Wise Practice
    </h2>


    <span id="topicCount">
        0 Topics
    </span>

</div>


<section
    id="topicList"
    class="topic-grid"
>

    <div class="chapter-loading">

        Loading topics...

    </div>

</section>



<!-- =================================================
     CHAPTER WISE — SECOND
================================================= -->

<div class="section-heading">

    <h2>
        Chapter Wise Practice
    </h2>


    <span>
        6 Types
    </span>

</div>


<section
    id="typePracticeGrid"
    class="type-practice-list"
>

    <div class="chapter-loading">

        Loading question types...

    </div>

</section>



<!-- INFO -->

<div class="chapter-info">

    💡
    <strong>Practice:</strong>
    Complete Topic Wise Practice first,
    then practice different NEET question types.

</div>


</main>



<!-- ================= BOTTOM NAV ================= -->

<nav class="chapter-bottom-nav">


<button
    class="bottom-item"
    type="button"
    onclick="goBackToStudent()"
>

    <span>🏠</span>

    <small>Home</small>

</button>


<button
    class="bottom-item active"
    type="button"
    onclick="goBackToCourse()"
>

    <span>📝</span>

    <small>Practice</small>

</button>


<button
    class="bottom-item"
    type="button"
    onclick="openNCERT()"
>

    <span>📖</span>

    <small>NCERT</small>

</button>


<button
    class="bottom-item"
    type="button"
    onclick="openVideos()"
>

    <span>▶️</span>

    <small>Videos</small>

</button>


</nav>

</div>


<!-- ================= JS ================= -->

<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/chapter.js"></script>


</body>

</html>
