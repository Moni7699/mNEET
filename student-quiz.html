<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mNEET - Student Quiz Engine</title>
    <!-- Tailwind CSS with Dark Mode Support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",
            authDomain: "mneet-spark.firebaseapp.com",
            databaseURL: "https://mneet-spark-default-rtdb.firebaseio.com",
            projectId: "mneet-spark",
            storageBucket: "mneet-spark.firebasestorage.app",
            messagingSenderId: "252201633700",
            appId: "1:252201633700:web:1a1e7a2cff1f0b168ea331"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Core App State
        let currentUserId = null;
        let currentUserName = "Aspirant";
        
        let allQuizzes = [];
        let selectedSubject = null;
        let selectedChapter = null;
        let selectedTopic = null;

        let activeQuizDoc = null;
        let quizQuestions = [];
        let currentQuestionIndex = 0;
        let quizMode = 'practice';

        // Timers & Answers
        let quizOverallSeconds = 0;
        let quizOverallInterval = null;
        let questionTimerInterval = null;
        let questionTimeRemainingMap = {};
        let studentAnswersMap = {};

        // Theme Sync from Dashboard Sidebar Switch Only
        window.syncAppTheme = function() {
            const savedTheme = localStorage.getItem('mneet_theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };

        onAuthStateChanged(auth, (user) => {
            window.syncAppTheme();
            if (user) {
                currentUserId = user.uid;
                currentUserName = user.displayName || user.email.split('@')[0] || "Aspirant";
            }
            window.listenRealtimeQuizzes();
        });

        // 1. Fetch Quizzes created by Admin from Firebase
        window.listenRealtimeQuizzes = function() {
            onSnapshot(query(collection(db, "quizzes"), orderBy("createdAt", "desc")), (snapshot) => {
                allQuizzes = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(!data.hidden) {
                        allQuizzes.push({ id: docSnap.id, ...data });
                    }
                });
                window.showSubjectStep();
            });
        };

        function hideAllViews() {
            document.getElementById('step-subject').classList.add('hidden');
            document.getElementById('step-chapter').classList.add('hidden');
            document.getElementById('step-topic').classList.add('hidden');
            document.getElementById('step-quiz-list').classList.add('hidden');
            document.getElementById('view-quiz-arena').classList.add('hidden');
            document.getElementById('view-quiz-result').classList.add('hidden');
        }

        // STEP 1: DYNAMIC SUBJECTS FROM ADMIN DATA
        window.showSubjectStep = function() {
            hideAllViews();
            selectedSubject = null;
            selectedChapter = null;
            selectedTopic = null;

            // Extract Unique Subjects created in Admin
            const dynamicSubjects = [...new Set(allQuizzes.map(q => q.subject).filter(Boolean))];

            const container = document.getElementById('subjectCardsContainer');
            container.innerHTML = "";

            if(dynamicSubjects.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 font-bold text-xs space-y-2">
                        <i class="fa-solid fa-folder-open text-4xl block text-slate-600 mb-2"></i>
                        <p>No subjects or quizzes published by Admin yet.</p>
                    </div>
                `;
            } else {
                dynamicSubjects.forEach(sub => {
                    const count = allQuizzes.filter(q => q.subject === sub).length;
                    container.innerHTML += `
                        <div onclick="window.selectSubject('${sub.replace(/'/g, "\\'")}')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm hover:border-emerald-500 transition cursor-pointer flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-500 flex items-center justify-center text-xl font-black">
                                    <i class="fa-solid fa-book-bookmark"></i>
                                </div>
                                <div>
                                    <h3 class="font-black text-sm text-slate-900 dark:text-white uppercase tracking-wider">${sub}</h3>
                                    <p class="text-xs text-slate-400 font-semibold">${count} Quizzes Created</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right text-slate-400"></i>
                        </div>
                    `;
                });
            }

            document.getElementById('step-subject').classList.remove('hidden');
        };

        // STEP 2: DYNAMIC CHAPTERS FROM ADMIN DATA
        window.selectSubject = function(subName) {
            selectedSubject = subName;
            hideAllViews();

            const subjectQuizzes = allQuizzes.filter(q => q.subject === selectedSubject);
            const chapters = [...new Set(subjectQuizzes.map(q => q.chapter).filter(Boolean))];

            document.getElementById('chapterSubjectTitle').innerText = selectedSubject.toUpperCase();
            const container = document.getElementById('chapterCardsContainer');
            container.innerHTML = "";

            if(chapters.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 font-bold text-xs py-10">No chapters found for this subject.</p>`;
            } else {
                chapters.forEach(ch => {
                    const chCount = subjectQuizzes.filter(q => q.chapter === ch).length;
                    container.innerHTML += `
                        <div onclick="window.selectChapter('${ch.replace(/'/g, "\\'")}')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm hover:border-emerald-500 transition cursor-pointer flex justify-between items-center">
                            <div>
                                <h4 class="font-black text-xs text-slate-900 dark:text-white">${ch}</h4>
                                <span class="text-[10px] text-slate-400 font-bold">${chCount} Topics / Quizzes</span>
                            </div>
                            <i class="fa-solid fa-folder-open text-emerald-500"></i>
                        </div>
                    `;
                });
            }

            document.getElementById('step-chapter').classList.remove('hidden');
        };
                // STEP 3: DYNAMIC TOPICS FROM ADMIN DATA
        window.selectChapter = function(chName) {
            selectedChapter = chName;
            hideAllViews();

            const chapterQuizzes = allQuizzes.filter(q => q.subject === selectedSubject && q.chapter === selectedChapter);
            const topics = [...new Set(chapterQuizzes.map(q => q.topic).filter(Boolean))];

            document.getElementById('topicChapterTitle').innerText = selectedChapter;
            const container = document.getElementById('topicCardsContainer');
            container.innerHTML = "";

            if(topics.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 font-bold text-xs py-10">No topics found for this chapter.</p>`;
            } else {
                topics.forEach(top => {
                    const topCount = chapterQuizzes.filter(q => q.topic === top).length;
                    container.innerHTML += `
                        <div onclick="window.selectTopic('${top.replace(/'/g, "\\'")}')" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-4 shadow-sm hover:border-emerald-500 transition cursor-pointer flex justify-between items-center">
                            <div>
                                <h4 class="font-black text-xs text-slate-900 dark:text-white">${top}</h4>
                                <span class="text-[10px] text-slate-400 font-bold">${topCount} Quizzes</span>
                            </div>
                            <i class="fa-solid fa-layer-group text-amber-500"></i>
                        </div>
                    `;
                });
            }

            document.getElementById('step-topic').classList.remove('hidden');
        };

        // STEP 4: DYNAMIC QUIZZES LIST & START
        window.selectTopic = function(topName) {
            selectedTopic = topName;
            hideAllViews();

            const targetQuizzes = allQuizzes.filter(q => 
                q.subject === selectedSubject && 
                q.chapter === selectedChapter && 
                q.topic === selectedTopic
            );

            document.getElementById('quizListTopicTitle').innerText = selectedTopic;
            const container = document.getElementById('quizListCardsContainer');
            container.innerHTML = "";

            if(targetQuizzes.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 font-bold text-xs py-10">No quizzes active right now.</p>`;
            } else {
                targetQuizzes.forEach(q => {
                    const isExamMode = (q.mode || 'practice') === 'exam';
                    container.innerHTML += `
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm space-y-3">
                            <div class="flex justify-between items-center">
                                <span class="text-[9px] font-black uppercase px-2.5 py-1 rounded-full ${isExamMode ? 'bg-rose-500/10 text-rose-500' : 'bg-emerald-500/10 text-emerald-500'}">
                                    <i class="fa-solid ${isExamMode ? 'fa-pen-clip' : 'fa-graduation-cap'} mr-1"></i> ${isExamMode ? 'Exam Mode' : 'Practice Mode'}
                                </span>
                                <span class="text-[10px] font-bold text-slate-400"><i class="fa-solid fa-clock mr-1"></i> ${q.timeLimit || 15} mins</span>
                            </div>
                            <h3 class="font-black text-sm text-slate-900 dark:text-white">${q.title || q.topic}</h3>
                            <button onclick="window.enterQuizArenaSession('${q.id}')" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs py-3 rounded-2xl shadow active:scale-95 transition flex items-center justify-center space-x-2">
                                <span>Start Quiz Now</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    `;
                });
            }

            document.getElementById('step-quiz-list').classList.remove('hidden');
        };

        // START QUIZ SESSION
        window.enterQuizArenaSession = function(quizId) {
            const foundQuiz = allQuizzes.find(q => q.id === quizId);
            if(!foundQuiz) return alert("Quiz missing!");

            activeQuizDoc = foundQuiz;
            quizMode = foundQuiz.mode || 'practice';

            onSnapshot(collection(db, `quizzes/${quizId}/questions`), (snapshot) => {
                quizQuestions = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(!data.hidden) quizQuestions.push({ id: docSnap.id, ...data });
                });

                if(quizQuestions.length === 0) return alert("No questions uploaded by Admin yet!");

                window.startQuizSessionEngine();
            });
        };

        window.startQuizSessionEngine = function() {
            currentQuestionIndex = 0;
            quizOverallSeconds = 0;
            studentAnswersMap = {};
            questionTimeRemainingMap = {};

            const defaultTimer = activeQuizDoc.perQuestionTimer ? parseInt(activeQuizDoc.perQuestionTimer) : 60;
            quizQuestions.forEach((q, idx) => {
                questionTimeRemainingMap[idx] = q.timer ? parseInt(q.timer) : defaultTimer;
            });

            hideAllViews();
            document.getElementById('view-quiz-arena').classList.remove('hidden');

            if(quizOverallInterval) clearInterval(quizOverallInterval);
            quizOverallInterval = setInterval(() => {
                quizOverallSeconds++;
                const m = String(Math.floor(quizOverallSeconds / 60)).padStart(2, '0');
                const s = String(quizOverallSeconds % 60).padStart(2, '0');
                document.getElementById('overallQuizStopwatchText').innerText = `${m}:${s}`;
            }, 1000);

            window.renderQuizQuickJumpGrid();
            window.loadQuizQuestionCard(0);
        };

        window.renderQuizQuickJumpGrid = function() {
            const container = document.getElementById('quizQuickJumpGridNode');
            container.innerHTML = "";

            quizQuestions.forEach((q, idx) => {
                const ansState = studentAnswersMap[idx];
                let btnStyle = "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700";

                if(ansState && ansState.submitted) {
                    btnStyle = quizMode === 'practice' ? (ansState.isCorrect ? "bg-emerald-500 text-white border-emerald-500" : "bg-rose-500 text-white border-rose-500") : "bg-amber-500 text-slate-950 font-black";
                } else if(idx === currentQuestionIndex) {
                    btnStyle = "bg-emerald-500 text-slate-950 border-emerald-500 font-black shadow-lg scale-105";
                }

                container.innerHTML += `
                    <button onclick="window.loadQuizQuestionCard(${idx})" class="w-8 h-8 rounded-xl font-black text-xs border flex items-center justify-center transition ${btnStyle}">
                        ${idx + 1}
                    </button>
                `;
            });
        };

        window.loadQuizQuestionCard = function(idx) {
            if(idx < 0 || idx >= quizQuestions.length) return;

            currentQuestionIndex = idx;
            window.renderQuizQuickJumpGrid();
            window.startPerQuestionTimer(idx);

            const q = quizQuestions[idx];
            const ansState = studentAnswersMap[idx] || {};

            const container = document.getElementById('singleQuizQuestionCanvasNode');
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 space-y-4 shadow-sm text-slate-900 dark:text-slate-100">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                        <span class="text-[10px] font-black uppercase text-emerald-500 tracking-wider">Question ${idx + 1} of ${quizQuestions.length}</span>
                        <div class="bg-slate-100 dark:bg-slate-800 text-emerald-500 font-black text-xs px-2.5 py-1 rounded-xl">
                            <span id="qQuizCountdownSecText">${questionTimeRemainingMap[idx]}s</span>
                        </div>
                    </div>

                    <div class="text-xs md:text-sm font-bold leading-relaxed whitespace-pre-wrap break-words">${q.qText || q.questionText || ''}</div>
                    ${(q.imgData || q.imageUrl) ? `<img src="${q.imgData || q.imageUrl}" class="w-full max-h-48 object-contain rounded-xl border border-slate-200 dark:border-slate-800">` : ''}

                    <div class="space-y-2 text-xs font-bold">
                        ${['A', 'B', 'C', 'D'].map(optKey => {
                            const optVal = q[`opt${optKey}`] || q[`option${optKey}`];
                            if(!optVal) return '';

                            const correctOptKey = q.correctOpt || q.correctOption;
                            let optStyle = "bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200";
                            
                            if(ansState.submitted) {
                                if(quizMode === 'practice') {
                                    if(optKey === correctOptKey) optStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-500 font-black";
                                    else if(ansState.selectedOpt === optKey && !ansState.isCorrect) optStyle = "bg-rose-500/20 border-rose-500 text-rose-500 font-black";
                                } else if(ansState.selectedOpt === optKey) {
                                    optStyle = "bg-amber-500/20 border-amber-500 text-amber-500 font-black";
                                }
                            } else if(ansState.selectedOpt === optKey) {
                                optStyle = "bg-emerald-500/30 border-emerald-500 text-emerald-500 font-black";
                            }

                            return `
                                <button onclick="window.selectQuizOptionChoice('${optKey}')" ${ansState.submitted ? 'disabled' : ''} class="w-full text-left p-3 rounded-2xl border ${optStyle} transition flex justify-between">
                                    <span><b class="mr-2">${optKey}.</b> ${optVal}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    ${ansState.submitted && quizMode === 'practice' ? `
                        <div class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-3 rounded-2xl space-y-1 mt-2">
                            <span class="text-[9px] font-black uppercase text-emerald-500 block">NCERT Solution Breakdown:</span>
                            <p class="text-xs text-slate-600 dark:text-slate-300">${q.solutionText || q.explanation || 'N/A'}</p>
                        </div>
                    ` : ''}
                </div>
            `;
        };

        window.startPerQuestionTimer = function(idx) {
            if(questionTimerInterval) clearInterval(questionTimerInterval);
            if(studentAnswersMap[idx] && studentAnswersMap[idx].submitted) {
                document.getElementById('qQuizCountdownSecText').innerText = "Locked";
                return;
            }

            questionTimerInterval = setInterval(() => {
                if(questionTimeRemainingMap[idx] > 0) {
                    questionTimeRemainingMap[idx]--;
                    const el = document.getElementById('qQuizCountdownSecText');
                    if(el) el.innerText = `${questionTimeRemainingMap[idx]}s`;
                } else {
                    clearInterval(questionTimerInterval);
                    if(!studentAnswersMap[idx]) studentAnswersMap[idx] = { selectedOpt: null, isCorrect: false, submitted: true, expired: true };
                    else studentAnswersMap[idx].submitted = true;
                    window.loadQuizQuestionCard(idx);
                }
            }, 1000);
        };

        window.selectQuizOptionChoice = function(optKey) {
            if(studentAnswersMap[currentQuestionIndex] && studentAnswersMap[currentQuestionIndex].submitted) return;
            studentAnswersMap[currentQuestionIndex] = { selectedOpt: optKey, submitted: false };
            window.loadQuizQuestionCard(currentQuestionIndex);
        };

        window.submitCurrentQuizQuestionAnswer = function() {
            const ans = studentAnswersMap[currentQuestionIndex];
            if(!ans || !ans.selectedOpt) return alert("Select an option first!");
            if(ans.submitted) return;

            const q = quizQuestions[currentQuestionIndex];
            const correctOptKey = q.correctOpt || q.correctOption;
            studentAnswersMap[currentQuestionIndex] = { selectedOpt: ans.selectedOpt, isCorrect: ans.selectedOpt === correctOptKey, submitted: true };
            window.loadQuizQuestionCard(currentQuestionIndex);
        };
                // RESULT & SUBMISSION (+4 / -1 BP Coins)
        window.finishFullQuizTest = function() {
            if(confirm("Submit your quiz now?")) {
                if(quizOverallInterval) clearInterval(quizOverallInterval);
                if(questionTimerInterval) clearInterval(questionTimerInterval);
                window.calculateAndDisplayQuizResultScreen();
            }
        };

        window.calculateAndDisplayQuizResultScreen = function() {
            const totalQ = quizQuestions.length;
            let correctCount = 0;
            let wrongCount = 0;
            let skippedCount = 0;

            quizQuestions.forEach((q, idx) => {
                const ans = studentAnswersMap[idx];
                if(ans && ans.submitted && !ans.expired && ans.selectedOpt) {
                    const correctOptKey = q.correctOpt || q.correctOption;
                    if(ans.selectedOpt === correctOptKey) correctCount++;
                    else wrongCount++;
                } else skippedCount++;
            });

            const earnedBPCoins = (correctCount * 4) - (wrongCount * 1);
            const rawScore = Math.max(0, earnedBPCoins);

            addDoc(collection(db, "rank_quiz_results"), {
                studentUid: currentUserId || 'guest',
                studentName: currentUserName,
                quizTitle: activeQuizDoc ? (activeQuizDoc.title || activeQuizDoc.topic) : 'Quiz',
                score: rawScore,
                totalQuestions: totalQ,
                correct: correctCount,
                wrong: wrongCount,
                skipped: skippedCount,
                createdAt: Date.now()
            }).catch(e => console.error("Error saving score: ", e));

            hideAllViews();
            document.getElementById('view-quiz-result').classList.remove('hidden');

            const container = document.getElementById('quizResultDashboardCanvasNode');
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 max-w-xl mx-auto my-auto text-slate-900 dark:text-white">
                    <div class="bg-gradient-to-r from-emerald-500/20 to-teal-500/20 border border-emerald-500/30 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-black uppercase text-emerald-500 block">Earned BP Coins (+4 / -1)</span>
                            <span class="text-2xl font-black">${earnedBPCoins > 0 ? '+' : ''}${earnedBPCoins} BP</span>
                        </div>
                        <i class="fa-solid fa-coins text-emerald-400 text-3xl"></i>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center text-xs font-bold">
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-emerald-500">
                            <span class="block font-black text-lg">${correctCount}</span> Correct (+4)
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-rose-500">
                            <span class="block font-black text-lg">${wrongCount}</span> Wrong (-1)
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800 text-slate-400">
                            <span class="block font-black text-lg">${skippedCount}</span> Skipped
                        </div>
                    </div>

                    <div class="flex space-x-2">
                        <button onclick="window.openQuizSolutionModal()" class="flex-1 bg-emerald-500 text-slate-950 font-black py-3 rounded-2xl text-xs shadow">View Solutions</button>
                        <button onclick="window.location.reload()" class="flex-1 bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 font-black py-3 rounded-2xl text-xs shadow">Home</button>
                    </div>
                </div>
            `;
        };

        window.openQuizSolutionModal = function() {
            const modal = document.getElementById('quizSolutionModalOverlay');
            const container = document.getElementById('quizSolutionQuestionListNode');
            modal.classList.remove('hidden');

            let html = "";
            quizQuestions.forEach((q, idx) => {
                const ans = studentAnswersMap[idx];
                const correctOptKey = q.correctOpt || q.correctOption;
                let isCorrect = ans && ans.submitted && ans.selectedOpt === correctOptKey;
                let dotColor = isCorrect ? "bg-emerald-500" : (ans && ans.selectedOpt ? "bg-rose-500" : "bg-slate-400");

                html += `
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full ${dotColor} inline-block"></span>
                            <span class="font-black text-slate-900 dark:text-white">Q${idx+1}: ${q.qText || q.questionText || ''}</span>
                        </div>
                        <p class="text-slate-500 text-[11px]"><b>Your Ans:</b> ${ans && ans.selectedOpt ? ans.selectedOpt : 'Skipped'} | <b>Correct Ans:</b> ${correctOptKey}</p>
                        <div class="bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-[11px] text-slate-600 dark:text-slate-300">
                            <b>Solution:</b> ${q.solutionText || q.explanation || 'N/A'}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        };

        window.closeQuizSolutionModal = function() {
            document.getElementById('quizSolutionModalOverlay').classList.add('hidden');
        };
    </script>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen transition-colors duration-300">
    <div id="quizPortalApp" class="min-h-screen flex flex-col justify-between">
        
        <!-- STEP 1: SUBJECT SCREEN -->
        <div id="step-subject" class="w-full flex-1 flex flex-col max-w-xl mx-auto p-4 space-y-4">
            <header class="flex justify-between items-center py-2">
                <button onclick="window.history.back()" class="text-slate-400 p-2 hover:text-emerald-500"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                <h1 class="font-black text-base text-slate-900 dark:text-white">Select Subject</h1>
                <div class="w-8"></div>
            </header>
            <div id="subjectCardsContainer" class="space-y-3"></div>
        </div>

        <!-- STEP 2: CHAPTER SCREEN -->
        <div id="step-chapter" class="w-full flex-1 flex flex-col max-w-xl mx-auto p-4 space-y-4 hidden">
            <header class="flex justify-between items-center py-2">
                <button onclick="window.showSubjectStep()" class="text-slate-400 p-2 hover:text-emerald-500"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                <h1 id="chapterSubjectTitle" class="font-black text-base text-slate-900 dark:text-white uppercase">Chapters</h1>
                <div class="w-8"></div>
            </header>
            <div id="chapterCardsContainer" class="space-y-2"></div>
        </div>

        <!-- STEP 3: TOPIC SCREEN -->
        <div id="step-topic" class="w-full flex-1 flex flex-col max-w-xl mx-auto p-4 space-y-4 hidden">
            <header class="flex justify-between items-center py-2">
                <button onclick="window.selectSubject(selectedSubject)" class="text-slate-400 p-2 hover:text-emerald-500"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                <h1 id="topicChapterTitle" class="font-black text-base text-slate-900 dark:text-white">Topics</h1>
                <div class="w-8"></div>
            </header>
            <div id="topicCardsContainer" class="space-y-2"></div>
        </div>

        <!-- STEP 4: QUIZ LIST SCREEN -->
        <div id="step-quiz-list" class="w-full flex-1 flex flex-col max-w-xl mx-auto p-4 space-y-4 hidden">
            <header class="flex justify-between items-center py-2">
                <button onclick="window.selectChapter(selectedChapter)" class="text-slate-400 p-2 hover:text-emerald-500"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                <h1 id="quizListTopicTitle" class="font-black text-base text-slate-900 dark:text-white">Quizzes</h1>
                <div class="w-8"></div>
            </header>
            <div id="quizListCardsContainer" class="space-y-3"></div>
        </div>

        <!-- QUIZ ARENA VIEW -->
        <div id="view-quiz-arena" class="fixed inset-0 bg-slate-50 dark:bg-slate-950 z-50 hidden flex flex-col w-screen h-screen overflow-hidden">
            <header class="bg-white dark:bg-slate-900 px-4 py-3 flex justify-between items-center border-b border-slate-200 dark:border-slate-800">
                <div class="bg-slate-100 dark:bg-slate-800 text-emerald-500 font-black text-xs px-3 py-1.5 rounded-xl">
                    <span id="overallQuizStopwatchText">00:00</span>
                </div>
                <button onclick="window.finishFullQuizTest()" class="bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-black shadow">Submit Quiz</button>
            </header>

            <div class="flex-1 w-full p-4 overflow-y-auto space-y-4 max-w-xl mx-auto pb-24">
                <div id="quizQuickJumpGridNode" class="grid grid-cols-8 gap-1.5 p-1 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl"></div>
                <div id="singleQuizQuestionCanvasNode"></div>
            </div>

            <div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-3 z-50">
                <div class="flex justify-between items-center gap-2 max-w-xl mx-auto">
                    <button onclick="window.loadQuizQuestionCard(currentQuestionIndex - 1)" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-black text-slate-700 dark:text-slate-300">Prev</button>
                    <button onclick="window.submitCurrentQuizQuestionAnswer()" class="flex-1 py-3 bg-emerald-500 text-slate-950 rounded-xl text-xs font-black shadow">Submit Answer</button>
                    <button onclick="window.loadQuizQuestionCard(currentQuestionIndex + 1)" class="flex-1 py-3 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-black text-slate-700 dark:text-slate-300">Next</button>
                </div>
            </div>
        </div>

        <!-- RESULT VIEW -->
        <div id="view-quiz-result" class="fixed inset-0 bg-slate-50 dark:bg-slate-950 z-50 hidden flex flex-col w-screen h-screen overflow-y-auto p-4">
            <div id="quizResultDashboardCanvasNode" class="my-auto"></div>
        </div>

        <!-- SOLUTION MODAL OVERLAY -->
        <div id="quizSolutionModalOverlay" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex flex-col p-4">
            <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-3xl max-w-xl w-full mx-auto flex flex-col h-full space-y-3">
                <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-2">
                    <h3 class="font-black text-sm text-slate-900 dark:text-white">Solutions Breakdown</h3>
                    <button onclick="window.closeQuizSolutionModal()" class="text-slate-400 hover:text-rose-500"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div id="quizSolutionQuestionListNode" class="flex-1 overflow-y-auto space-y-3"></div>
            </div>
        </div>

    </div>
</body>
</html>
