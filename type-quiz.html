<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Type Practice</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .type-quiz-page {
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .quiz-header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;

            padding: 13px 17px;

            background:
                rgba(4,10,21,0.96);

            backdrop-filter: blur(18px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);
        }

        .back-btn {
            border: none;
            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }

        .quiz-title {
            flex: 1;
            min-width: 0;
        }

        .quiz-title small {
            display: block;

            color: #8997ae;

            font-size: 10px;

            margin-bottom: 3px;
        }

        .quiz-title strong {
            display: block;

            color: white;

            font-size: 14px;

            overflow: hidden;

            white-space: nowrap;

            text-overflow: ellipsis;
        }

        .timer-box {
            min-width: 72px;

            padding: 9px 10px;

            text-align: center;

            border-radius: 10px;

            background:
                rgba(255,193,7,0.08);

            border:
                1px solid
                rgba(255,193,7,0.20);

            color: #ffc107;

            font-weight: 900;

            font-size: 14px;
        }

        .quiz-main {
            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 20px 15px 35px;
        }

        .progress-row {
            display: flex;

            align-items: center;

            justify-content: space-between;

            margin-bottom: 10px;

            color: #8997ae;

            font-size: 12px;
        }

        .progress-row strong {
            color: white;
        }

        .question-card {
            overflow: hidden;

            border-radius: 20px;

            background:
                rgba(14,25,45,0.96);

            border:
                1px solid
                rgba(255,255,255,0.07);

            box-shadow:
                0 18px 45px
                rgba(0,0,0,0.25);
        }

        .question-top {
            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 17px 18px;

            border-bottom:
                1px solid
                rgba(255,255,255,0.06);
        }

        .question-number {
            color: #ffc107;

            font-size: 13px;

            font-weight: 900;
        }

        .question-status {
            color: #7f8da5;

            font-size: 11px;
        }

        .question-content {
            padding: 20px;
        }

        .question-text {
            color: #f3f6fa;

            font-size: 16px;

            line-height: 1.7;

            margin-bottom: 18px;
        }

        .question-image-box {
            width: 100%;

            min-height: 180px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 15px;

            margin-bottom: 18px;

            background: #091426;

            border-radius: 12px;
        }

        .question-image-box img {
            max-width: 100%;

            max-height: 400px;

            object-fit: contain;

            border-radius: 8px;
        }

        .image-placeholder {
            color: #65748b;

            text-align: center;

            font-size: 12px;

            line-height: 1.5;
        }

        .options {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .option {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px;

            border-radius: 13px;

            border:
                1px solid
                #263751;

            background:
                #0a1528;

            color: #dce3ee;

            text-align: left;

            cursor: pointer;

            transition: 0.2s;
        }

        .option.selected {
            border-color: #ffc107;

            background:
                rgba(255,193,7,0.10);

            color: white;
        }

        .option.correct {
            border-color: #35c878;

            background:
                rgba(53,200,120,0.10);

            color: #7ff0af;
        }

        .option.wrong {
            border-color: #ff5c5c;

            background:
                rgba(255,92,92,0.10);

            color: #ff8585;
        }

        .option:disabled {
            cursor: default;
        }

        .option-number {
            width: 31px;

            height: 31px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background: #17263d;

            color: #b5c1d1;

            font-size: 12px;

            font-weight: 900;
        }

        .option-text {
            font-size: 13px;

            line-height: 1.5;
        }

        .solution-box {
            display: none;

            margin-top: 18px;

            padding: 15px;

            border-radius: 13px;

            background:
                rgba(255,193,7,0.06);

            border:
                1px solid
                rgba(255,193,7,0.15);
        }

        .solution-box.show {
            display: block;
        }

        .solution-title {
            color: #ffc107;

            font-size: 13px;

            font-weight: 900;

            margin-bottom: 7px;
        }

        .solution-text {
            color: #aeb9ca;

            font-size: 12px;

            line-height: 1.6;
        }

        .actions {
            display: grid;

            grid-template-columns:
                1fr 1.3fr 1fr;

            gap: 10px;

            margin-top: 18px;
        }

        .action-btn {
            min-height: 46px;

            border-radius: 11px;

            border:
                1px solid
                #293955;

            background: #0b172a;

            color: #dce3ee;

            font-weight: 800;

            cursor: pointer;
        }

        .answer-btn {
            background: #ffc107;

            color: #171717;

            border-color: #ffc107;
        }

        .submit-btn {
            color: #ff8585;

            border-color:
                rgba(255,92,92,0.30);
        }

        .action-btn:disabled {
            opacity: 0.45;

            cursor: default;
        }

        .loading {
            min-height: 300px;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #8997ae;
        }

        .error {
            padding: 30px;

            text-align: center;

            color: #ff8585;
        }

        @media (max-width: 600px) {

            .quiz-main {
                padding:
                    15px 11px 30px;
            }

            .actions {
                grid-template-columns:
                    1fr 1fr;
            }

            .answer-btn {
                grid-column: 1 / -1;

                order: -1;
            }

        }

    </style>

</head>


<body>


<div class="type-quiz-page">


    <header class="quiz-header">

        <button
            class="back-btn"
            onclick="exitTypeQuiz()"
        >
            ←
        </button>


        <div class="quiz-title">

            <small>
                mNEET CHAPTER PRACTICE
            </small>

            <strong id="typeTitle">
                Loading...
            </strong>

        </div>


        <div
            id="questionTimer"
            class="timer-box"
        >
            60s
        </div>

    </header>



    <main class="quiz-main">


        <div class="progress-row">

            <span>

                Question

                <strong id="currentQuestion">
                    1
                </strong>

                /

                <strong id="totalQuestions">
                    0
                </strong>

            </span>


            <span>

                Total:

                <strong id="totalTimer">
                    00:00
                </strong>

            </span>

        </div>



        <div
            id="quizContainer"
            class="question-card"
        >

            <div class="loading">
                Loading questions...
            </div>

        </div>


    </main>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/type-quiz.js"></script>


</body>

</html>
