<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Quiz</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            background: #050b18;
            color: white;
            font-family: Arial, sans-serif;
        }


        .quiz-page {
            min-height: 100vh;
            padding-bottom: 30px;
        }


        /* ==============================
           HEADER
        ============================== */

        .quiz-header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 13px 15px;

            background: rgba(4, 10, 21, 0.97);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);

            backdrop-filter: blur(15px);
        }


        .quiz-brand {
            font-size: 21px;
            font-weight: 900;
            color: #ffc107;
        }


        .quiz-brand span {
            color: white;
        }


        .quiz-back {
            width: 42px;
            height: 42px;

            border: none;
            border-radius: 12px;

            background: #111a2c;

            color: white;

            font-size: 22px;

            cursor: pointer;
        }


        /* ==============================
           TIMER AREA
        ============================== */

        .timer-area {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            max-width: 900px;

            margin: 15px auto 0;

            padding: 0 15px;
        }


        .timer-card {
            padding: 13px;

            border-radius: 14px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,193,7,0.15);

            text-align: center;
        }


        .timer-label {
            display: block;

            color: #8997aa;

            font-size: 10px;

            font-weight: 800;

            margin-bottom: 5px;

            text-transform: uppercase;
        }


        .timer-value {
            color: #ffc107;

            font-size: 21px;

            font-weight: 900;
        }


        .timer-danger {
            color: #ff5252 !important;
        }


        /* ==============================
           MAIN
        ============================== */

        .quiz-main {
            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 18px 15px;
        }


        /* ==============================
           QUIZ INFO
        ============================== */

        .quiz-info {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 10px;

            margin-bottom: 14px;

            color: #8997aa;

            font-size: 12px;
        }


        .question-number {
            color: white;

            font-weight: 900;
        }


        /* ==============================
           PROGRESS
        ============================== */

        .progress-bar {
            width: 100%;

            height: 6px;

            border-radius: 20px;

            overflow: hidden;

            background: #172236;

            margin-bottom: 18px;
        }


        .progress-fill {
            width: 0%;

            height: 100%;

            background: #ffc107;

            transition: width 0.25s;
        }


        /* ==============================
           QUESTION CARD
        ============================== */

        .question-card {
            padding: 20px;

            border-radius: 18px;

            background:
                linear-gradient(
                    145deg,
                    #10213b,
                    #07101f
                );

            border:
                1px solid
                rgba(255,193,7,0.14);

            margin-bottom: 15px;
        }


        .question-text {
            color: white;

            font-size: 18px;

            line-height: 1.6;

            font-weight: 700;

            margin: 0;
        }


        .question-image {
            width: 100%;

            max-height: 360px;

            object-fit: contain;

            border-radius: 12px;

            margin-top: 15px;

            background: #050b18;
        }


        /* ==============================
           OPTIONS
        ============================== */

        .options {
            display: flex;

            flex-direction: column;

            gap: 11px;

            margin-top: 17px;
        }


        .option {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 14px;

            border-radius: 13px;

            border:
                1px solid
                rgba(255,255,255,0.09);

            background: #0d192c;

            color: #dce3ec;

            cursor: pointer;

            text-align: left;

            transition: 0.2s;
        }


        .option:hover {
            border-color:
                rgba(255,193,7,0.35);
        }


        .option-letter {
            min-width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 9px;

            background: #18263c;

            color: #ffc107;

            font-weight: 900;
        }


        .option-text {
            font-size: 14px;

            line-height: 1.5;
        }


        .option.selected {
            border-color: #ffc107;

            background:
                rgba(255,193,7,0.10);
        }


        .option.correct {
            border-color: #32d583;

            background:
                rgba(50,213,131,0.12);

            color: #ffffff;
        }


        .option.correct .option-letter {
            background: #32d583;

            color: #07101f;
        }


        .option.wrong {
            border-color: #ff5252;

            background:
                rgba(255,82,82,0.12);

            color: white;
        }


        .option.wrong .option-letter {
            background: #ff5252;

            color: white;
        }


        .option.disabled {
            cursor: default;
        }


        /* ==============================
           ANSWER STATUS
        ============================== */

        .answer-status {
            display: none;

            padding: 13px;

            margin-top: 15px;

            border-radius: 12px;

            font-size: 13px;

            line-height: 1.5;
        }


        .answer-status.show {
            display: block;
        }


        .answer-status.correct-status {
            background:
                rgba(50,213,131,0.10);

            border:
                1px solid
                rgba(50,213,131,0.25);

            color: #69e6a2;
        }


        .answer-status.wrong-status {
            background:
                rgba(255,82,82,0.10);

            border:
                1px solid
                rgba(255,82,82,0.25);

            color: #ff8585;
        }


        /* ==============================
           SOLUTION
        ============================== */

        .solution-box {
            display: none;

            margin-top: 15px;

            padding: 16px;

            border-radius: 13px;

            background: #0b1628;

            border:
                1px solid
                rgba(255,193,7,0.14);
        }


        .solution-box.show {
            display: block;
        }


        .solution-title {
            color: #ffc107;

            font-size: 13px;

            font-weight: 900;

            margin-bottom: 8px;
        }


        .solution-text {
            color: #b5c0cf;

            font-size: 13px;

            line-height: 1.7;
        }


        .reference-text {
            margin-top: 10px;

            color: #8f9caf;

            font-size: 12px;
        }


        /* ==============================
           BUTTONS
        ============================== */

        .quiz-actions {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 10px;

            margin-top: 18px;
        }


        .quiz-button {
            min-height: 46px;

            border: none;

            border-radius: 11px;

            font-weight: 900;

            cursor: pointer;
        }


        .previous-button {
            background: #17263d;

            color: white;
        }


        .next-button {
            background: #ffc107;

            color: #111;
        }


        .submit-answer-button {
            width: 100%;

            min-height: 48px;

            margin-top: 12px;

            border: none;

            border-radius: 11px;

            background: #ffc107;

            color: #111;

            font-weight: 900;

            cursor: pointer;
        }


        .submit-answer-button:disabled {
            opacity: 0.45;

            cursor: not-allowed;
        }


        .submit-quiz-button {
            width: 100%;

            min-height: 48px;

            margin-top: 10px;

            border: none;

            border-radius: 11px;

            background: #d9363e;

            color: white;

            font-weight: 900;

            cursor: pointer;
        }


        /* ==============================
           LOADING
        ============================== */

        .quiz-loading {
            text-align: center;

            padding: 70px 20px;

            color: #8997aa;
        }


        .quiz-error {
            text-align: center;

            padding: 50px 20px;

            color: #ff8585;
        }


        /* ==============================
           RESPONSIVE
        ============================== */

        @media (max-width: 600px) {

            .question-card {
                padding: 16px;
            }


            .question-text {
                font-size: 17px;
            }


            .timer-value {
                font-size: 18px;
            }

        }

    </style>

</head>


<body>


<div class="quiz-page">


    <!-- HEADER -->

    <header class="quiz-header">

        <button
            class="quiz-back"
            onclick="goBackToTopic()"
        >
            ←
        </button>


        <div class="quiz-brand">
            <span>m</span>NEET
        </div>


        <div
            style="
                width:42px;
            "
        ></div>

    </header>



    <!-- TIMER -->

    <section class="timer-area">


        <div class="timer-card">

            <span class="timer-label">
                Question Time
            </span>

            <span
                id="questionTimer"
                class="timer-value"
            >
                60
            </span>

        </div>


        <div class="timer-card">

            <span class="timer-label">
                Total Time
            </span>

            <span
                id="totalTimer"
                class="timer-value"
            >
                00:00
            </span>

        </div>


    </section>



    <!-- MAIN -->

    <main class="quiz-main">


        <!-- QUIZ INFO -->

        <div class="quiz-info">

            <span
                id="quizTitle"
            >
                Loading Quiz...
            </span>


            <span
                id="questionCounter"
                class="question-number"
            >
                0 / 0
            </span>

        </div>



        <!-- PROGRESS -->

        <div class="progress-bar">

            <div
                id="progressFill"
                class="progress-fill"
            ></div>

        </div>



        <!-- QUIZ AREA -->

        <section
            id="quizContainer"
        >

            <div class="quiz-loading">

                Loading questions...

            </div>

        </section>


    </main>


</div>



<!-- Firebase -->

<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/quiz.js"></script>


</body>

</html>
