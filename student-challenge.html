<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>mNEET - Student Challenge Arena</title>
    <!-- Tailwind CSS with Dark support -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",
            authDomain: "mneet-spark.firebaseapp.com",
            databaseURL: "https://mneet-spark-default-rtdb.firebaseio.com",
            projectId: "mneet-spark",
            storageBucket: "mneet-spark.firebasestorage.app",
            messagingSenderId: "252201633700",
            appId: "1:252201633700:web:1a1e7a2cff1f0b168ea331"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let activeTab = 'daily';
        let currentUserId = null;
        let currentUserName = "Aspirant";
        let loadedChallenges = [];
        let activeChallengeDoc = null;
        let challengeQuestions = [];

        // Engine State
        let currentQuestionIndex = 0;
        let activeSubjectFilter = 'all'; 
        let quizOverallSeconds = 0;
        let quizOverallInterval = null;
        let questionTimerInterval = null;
        
        // Tracking Stores
        let questionTimeRemainingMap = {}; 
        let studentAnswersMap = {}; 
        let attemptCount = parseInt(localStorage.getItem('mneet_challenge_attempt_count') || '1');
        let initialQuestionDuration = Math.max(30, 70 - (attemptCount * 10)); // 60s, 50s, 40s, 30s

        // System AI Challengers (Cold Start Fallback)
        const AI_BOTS = [
            { name: "Aarav Sharma (AI Ranker)", scoreFactor: 0.88, timeSec: 180 },
            { name: "Ananya Roy (NEET Prep)", scoreFactor: 0.75, timeSec: 210 },
            { name: "Rohan Verma (Top 1% AI)", scoreFactor: 0.95, timeSec: 150 }
        ];

        // Theme Engine Sync with student-dashboard.html
        window.syncAppTheme = function() {
            const savedTheme = localStorage.getItem('mneet_theme') || localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        };

        onAuthStateChanged(auth, (user) => {
            window.syncAppTheme();
            if (user) {
                currentUserId = user.uid;
                currentUserName = user.displayName || user.email.split('@')[0] || "Aspirant";
            }
            window.switchChallengeTab(activeTab);

            // Check URL Params for direct shared invite links
            const urlParams = new URLSearchParams(window.location.search);
            const directChallengeId = urlParams.get('challengeId');
            if(directChallengeId) {
                window.enterChallengeArenaFromDirectLink(directChallengeId);
            }
        });
                window.switchChallengeTab = function(tab) {
            activeTab = tab;
            const btnDaily = document.getElementById('tabBtnDaily');
            const btnWeekly = document.getElementById('tabBtnWeekly');

            if(tab === 'daily') {
                btnDaily.className = "flex-1 py-2.5 rounded-xl text-xs font-black bg-rose-500 text-white shadow-md transition";
                btnWeekly.className = "flex-1 py-2.5 rounded-xl text-xs font-black text-slate-400 hover:text-white transition";
            } else {
                btnWeekly.className = "flex-1 py-2.5 rounded-xl text-xs font-black bg-rose-500 text-white shadow-md transition";
                btnDaily.className = "flex-1 py-2.5 rounded-xl text-xs font-black text-slate-400 hover:text-white transition";
            }
            window.listenRealtimeChallenges();
        };

        // Listen for Challenges Published by Admin
        window.listenRealtimeChallenges = function() {
            onSnapshot(query(collection(db, "challenges"), orderBy("createdAt", "desc")), (snapshot) => {
                loadedChallenges = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(!data.hidden && (data.category || 'daily') === activeTab) {
                        loadedChallenges.push({ id: docSnap.id, ...data });
                    }
                });
                window.renderChallengeCardsNode();
            });
        };

        window.renderChallengeCardsNode = function() {
            const container = document.getElementById('challengeCardsNode');
            container.innerHTML = "";

            if(loadedChallenges.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400 font-bold text-xs space-y-2">
                        <i class="fa-solid fa-trophy-slash text-3xl block text-slate-600"></i>
                        <p>No active ${activeTab} challenges published by Admin right now.</p>
                    </div>
                `;
                return;
            }

            loadedChallenges.forEach(c => {
                container.innerHTML += `
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 shadow-sm space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="bg-amber-500/10 text-amber-500 text-[10px] font-black uppercase px-2.5 py-1 rounded-full"><i class="fa-solid fa-bolt mr-1"></i> Live Challenge</span>
                            <span class="text-[10px] font-bold text-slate-400"><i class="fa-solid fa-clock mr-1"></i> 24h Expiry</span>
                        </div>
                        <div>
                            <h3 class="font-black text-sm text-slate-900 dark:text-white">${c.name}</h3>
                            <p class="text-[11px] text-slate-400 font-semibold mt-0.5">${c.description || 'Test your concepts with instant AI matchmaking competition.'}</p>
                        </div>
                        <div class="flex space-x-2 pt-1">
                            <button onclick="window.openInviteModal('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')" class="bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-black text-xs px-3 py-3 rounded-2xl transition">
                                <i class="fa-solid fa-user-plus mr-1"></i> Invite
                            </button>
                            <button onclick="window.enterChallengeArena('${c.id}', '${(c.name || '').replace(/'/g, "\\'")}')" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-black text-xs py-3 rounded-2xl shadow active:scale-95 transition flex items-center justify-center space-x-2">
                                <span>Enter Challenge Arena</span>
                                <i class="fa-solid fa-arrow-right text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        };

        window.openInviteModal = function(id, name) {
            const inviteUrl = `${window.location.origin}/student-challenge.html?challengeId=${id}`;
            document.getElementById('inviteChallengeName').innerText = name;
            document.getElementById('inviteLinkInput').value = inviteUrl;
            document.getElementById('inviteModalOverlay').classList.remove('hidden');
        };

        window.closeInviteModal = function() {
            document.getElementById('inviteModalOverlay').classList.add('hidden');
        };

        window.copyInviteLink = function() {
            const input = document.getElementById('inviteLinkInput');
            input.select();
            document.execCommand('copy');
            alert('Challenge invite link copied!');
        };

        window.shareWhatsApp = function() {
            const url = document.getElementById('inviteLinkInput').value;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent('Accept my NEET challenge on mNEET: ' + url)}`, '_blank');
        };

        window.shareTelegram = function() {
            const url = document.getElementById('inviteLinkInput').value;
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent('Accept my NEET challenge!')}`, '_blank');
        };

        // Examination Arena Engine (Syncing Admin Data)
        window.enterChallengeArenaFromDirectLink = async function(id) {
            try {
                const docRef = doc(db, "challenges", id);
                const docSnap = await getDoc(docRef);
                if(docSnap.exists()) {
                    window.enterChallengeArena(id, docSnap.data().name || "Challenge");
                }
            } catch(e) { console.error("Error direct link: ", e); }
        };

        window.enterChallengeArena = function(id, name) {
            activeChallengeDoc = { id, name };

            // Fetch Questions Created by Admin from Sub-collection
            onSnapshot(collection(db, `challenges/${id}/questions`), (snapshot) => {
                challengeQuestions = [];
                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    if(!data.hidden) {
                        challengeQuestions.push({ id: docSnap.id, ...data });
                    }
                });

                if(challengeQuestions.length === 0) {
                    alert("This challenge has no questions deployed by Admin yet!");
                    return;
                }

                window.initChallengeSessionState();
            });
        };
                window.initChallengeSessionState = function() {
            currentQuestionIndex = 0;
            quizOverallSeconds = 0;
            studentAnswersMap = {};
            questionTimeRemainingMap = {};

            // Initialize question timers (Support Admin custom time OR fallback to attempt logic)
            challengeQuestions.forEach((q, idx) => {
                questionTimeRemainingMap[idx] = q.timer ? parseInt(q.timer) : initialQuestionDuration;
            });

            document.getElementById('view-challenge-list').classList.add('hidden');
            document.getElementById('view-challenge-arena').classList.remove('hidden');

            if(quizOverallInterval) clearInterval(quizOverallInterval);
            quizOverallInterval = setInterval(() => {
                quizOverallSeconds++;
                const m = String(Math.floor(quizOverallSeconds / 60)).padStart(2, '0');
                const s = String(quizOverallSeconds % 60).padStart(2, '0');
                document.getElementById('overallStopwatchText').innerText = `${m}:${s}`;
            }, 1000);

            window.renderSubjectFilterTabs();
            window.renderQuickJumpGrid();
            window.loadQuestionCard(0);
        };

        window.renderSubjectFilterTabs = function() {
            const subjects = ['all', 'physics', 'chemistry', 'botany', 'zoology'];
            const container = document.getElementById('subjectFilterTabsNode');
            container.innerHTML = "";

            subjects.forEach(sub => {
                const isActive = sub === activeSubjectFilter;
                container.innerHTML += `
                    <button onclick="window.setSubjectFilter('${sub}')" class="px-3 py-1 rounded-xl text-[10px] font-black uppercase transition whitespace-nowrap ${isActive ? 'bg-rose-500 text-white shadow' : 'bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:text-rose-500'}">
                        ${sub}
                    </button>
                `;
            });
        };

        window.setSubjectFilter = function(sub) {
            activeSubjectFilter = sub;
            window.renderSubjectFilterTabs();
            window.renderQuickJumpGrid();
        };

        window.renderQuickJumpGrid = function() {
            const container = document.getElementById('quickJumpGridNode');
            container.innerHTML = "";

            challengeQuestions.forEach((q, idx) => {
                const sub = (q.subject || 'all').toLowerCase();
                if(activeSubjectFilter !== 'all' && sub !== activeSubjectFilter) return;

                const ansState = studentAnswersMap[idx];
                let btnStyle = "bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border-slate-200 dark:border-slate-700";

                if(ansState && ansState.submitted) {
                    btnStyle = ansState.isCorrect ? "bg-emerald-500 text-white border-emerald-500" : "bg-rose-500 text-white border-rose-500";
                } else if(idx === currentQuestionIndex) {
                    btnStyle = "bg-amber-500 text-slate-950 border-amber-500 font-black shadow-lg scale-105";
                }

                container.innerHTML += `
                    <button onclick="window.loadQuestionCard(${idx})" class="w-8 h-8 rounded-xl font-black text-xs border flex items-center justify-center transition ${btnStyle}">
                        ${idx + 1}
                    </button>
                `;
            });
        };

        window.loadQuestionCard = function(idx) {
            if(idx < 0 || idx >= challengeQuestions.length) return;

            currentQuestionIndex = idx;
            window.renderQuickJumpGrid();
            window.startQuestionTimer(idx);

            const q = challengeQuestions[idx];
            const ansState = studentAnswersMap[idx] || {};

            const container = document.getElementById('singleQuestionCanvasNode');
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-5 space-y-4 shadow-sm text-slate-900 dark:text-slate-100">
                    <div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
                        <span class="text-[10px] font-black uppercase text-amber-500 tracking-wider">
                            <i class="fa-solid fa-layer-group mr-1"></i> Question ${idx + 1} of ${challengeQuestions.length} (${(q.subject || 'General').toUpperCase()})
                        </span>
                        <div id="qCountdownBadge" class="bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-amber-500 font-black text-xs px-2.5 py-1 rounded-xl flex items-center space-x-1">
                            <i class="fa-solid fa-hourglass-half text-[10px]"></i>
                            <span id="qCountdownSecText">${questionTimeRemainingMap[idx]}s</span>
                        </div>
                    </div>

                    <div class="text-xs md:text-sm font-bold leading-relaxed whitespace-pre-wrap break-words">
                        ${q.qText || q.questionText || ''}
                    </div>

                    ${(q.imgData || q.imageUrl) ? `<img src="${q.imgData || q.imageUrl}" class="w-full max-h-48 object-contain rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950">` : ''}

                    <!-- Options Matrix -->
                    <div class="space-y-2 text-xs font-bold">
                        ${['A', 'B', 'C', 'D'].map(optKey => {
                            const optVal = q[`opt${optKey}`] || q[`option${optKey}`];
                            if(!optVal) return '';

                            const correctOptKey = q.correctOpt || q.correctOption;
                            let optStyle = "bg-slate-50 dark:bg-slate-800/80 border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800";
                            
                            if(ansState.submitted) {
                                if(optKey === correctOptKey) {
                                    optStyle = "bg-emerald-500/20 border-emerald-500 text-emerald-600 dark:text-emerald-400 font-black";
                                } else if(ansState.selectedOpt === optKey && !ansState.isCorrect) {
                                    optStyle = "bg-rose-500/20 border-rose-500 text-rose-600 dark:text-rose-400 font-black";
                                }
                            } else if(ansState.selectedOpt === optKey) {
                                optStyle = "bg-rose-500/30 border-rose-500 text-rose-600 dark:text-white font-black";
                            }

                            return `
                                <button onclick="window.selectOptionChoice('${optKey}')" ${ansState.submitted ? 'disabled' : ''} class="w-full text-left p-3 rounded-2xl border ${optStyle} transition flex items-center justify-between">
                                    <span><b class="mr-2">${optKey}.</b> ${optVal}</span>
                                    ${ansState.submitted && optKey === correctOptKey ? '<i class="fa-solid fa-circle-check text-emerald-500"></i>' : ''}
                                    ${ansState.submitted && ansState.selectedOpt === optKey && !ansState.isCorrect ? '<i class="fa-solid fa-circle-xmark text-rose-500"></i>' : ''}
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <!-- Instant NCERT Solution Breakdown -->
                    ${ansState.submitted ? `
                        <div class="bg-slate-50 dark:bg-slate-950 border border-slate-200 dark:border-slate-800 p-3.5 rounded-2xl space-y-1 mt-2">
                            <span class="text-[9px] font-black uppercase text-amber-500 block"><i class="fa-solid fa-lightbulb mr-1"></i> Solution Breakdown:</span>
                            <p class="text-xs text-slate-700 dark:text-slate-300 font-medium leading-relaxed whitespace-pre-wrap">${q.solutionText || q.explanation || 'No specific breakdown provided for this question.'}</p>
                        </div>
                    ` : ''}
                </div>
            `;
        };
                window.startQuestionTimer = function(idx) {
            if(questionTimerInterval) clearInterval(questionTimerInterval);

            if(studentAnswersMap[idx] && studentAnswersMap[idx].submitted) {
                document.getElementById('qCountdownSecText').innerText = "Done";
                return;
            }

            questionTimerInterval = setInterval(() => {
                if(questionTimeRemainingMap[idx] > 0) {
                    questionTimeRemainingMap[idx]--;
                    const el = document.getElementById('qCountdownSecText');
                    if(el) el.innerText = `${questionTimeRemainingMap[idx]}s`;
                } else {
                    clearInterval(questionTimerInterval);
                    if(!studentAnswersMap[idx]) {
                        studentAnswersMap[idx] = { selectedOpt: null, isCorrect: false, submitted: true, expired: true };
                    } else {
                        studentAnswersMap[idx].submitted = true;
                    }
                    window.loadQuestionCard(idx);
                }
            }, 1000);
        };

        window.selectOptionChoice = function(optKey) {
            if(studentAnswersMap[currentQuestionIndex] && studentAnswersMap[currentQuestionIndex].submitted) return;
            studentAnswersMap[currentQuestionIndex] = { selectedOpt: optKey, submitted: false };
            window.loadQuestionCard(currentQuestionIndex);
        };

        window.submitCurrentQuestionAnswer = function() {
            const ans = studentAnswersMap[currentQuestionIndex];
            if(!ans || !ans.selectedOpt) {
                return alert("Please select an option first!");
            }
            if(ans.submitted) return;

            const q = challengeQuestions[currentQuestionIndex];
            const correctOptKey = q.correctOpt || q.correctOption;
            const isCorrect = ans.selectedOpt === correctOptKey;

            studentAnswersMap[currentQuestionIndex] = {
                selectedOpt: ans.selectedOpt,
                isCorrect,
                submitted: true
            };

            window.loadQuestionCard(currentQuestionIndex);
        };

        // Complete Quiz Submission & Analytics Engine
        window.finishFullChallengeTest = function() {
            if(confirm("Are you sure you want to finish and submit your challenge test?")) {
                if(quizOverallInterval) clearInterval(quizOverallInterval);
                if(questionTimerInterval) clearInterval(questionTimerInterval);

                localStorage.setItem('mneet_challenge_attempt_count', String(attemptCount + 1));
                window.calculateAndDisplayResultScreen();
            }
        };

        window.calculateAndDisplayResultScreen = function() {
            const totalQ = challengeQuestions.length;
            let correctCount = 0;
            let wrongCount = 0;
            let skippedCount = 0;

            challengeQuestions.forEach((q, idx) => {
                const ans = studentAnswersMap[idx];
                if(ans && ans.submitted && !ans.expired) {
                    if(ans.isCorrect) correctCount++;
                    else wrongCount++;
                } else {
                    skippedCount++;
                }
            });

            const earnedBPCoins = (correctCount * 4) - (wrongCount * 2);
            const rawScore = Math.max(0, earnedBPCoins);
            const totalPossibleScore = totalQ * 4;
            const scorePct = Math.round((rawScore / totalPossibleScore) * 100);
            const accuracyPct = Math.round((correctCount / Math.max(1, (correctCount + wrongCount))) * 100);

            // Save Result to Firestore
            addDoc(collection(db, "rank_challenge_results"), {
                studentUid: currentUserId || 'guest',
                studentName: currentUserName,
                challengeId: activeChallengeDoc ? activeChallengeDoc.id : 'unknown',
                score: rawScore,
                totalQuestions: totalQ,
                correct: correctCount,
                wrong: wrongCount,
                skipped: skippedCount,
                timeTaken: Math.ceil(quizOverallSeconds / 60),
                createdAt: Date.now(),
                hidden: false
            }).catch(e => console.error("Error saving score: ", e));

            document.getElementById('view-challenge-arena').classList.add('hidden');
            document.getElementById('view-challenge-result').classList.remove('hidden');

            const container = document.getElementById('resultDashboardCanvasNode');
            container.innerHTML = `
                <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 shadow-2xl space-y-6 text-slate-900 dark:text-slate-100 max-w-xl mx-auto">
                    
                    <!-- BP Coins Header -->
                    <div class="bg-gradient-to-r from-amber-500/20 to-rose-500/20 border border-amber-500/30 p-4 rounded-2xl flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-black uppercase text-amber-500 block tracking-wider">Earned BP Coins</span>
                            <span class="text-2xl font-black text-slate-900 dark:text-white">${earnedBPCoins > 0 ? '+' : ''}${earnedBPCoins} BP</span>
                        </div>
                        <i class="fa-solid fa-coins text-amber-400 text-3xl"></i>
                    </div>

                    <!-- Total Percentage Bar -->
                    <div class="space-y-1.5">
                        <div class="flex justify-between text-xs font-black">
                            <span>Total Test Percentage</span>
                            <span class="text-emerald-500">${scorePct}%</span>
                        </div>
                        <div class="w-full bg-slate-100 dark:bg-slate-800 h-3 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full rounded-full transition-all duration-1000" style="width: ${scorePct}%"></div>
                        </div>
                    </div>

                    <!-- Core Metrics Grid -->
                    <div class="grid grid-cols-2 gap-3 text-xs font-bold">
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                            <span class="text-[9px] text-emerald-500 uppercase font-black block">Correct (+4)</span>
                            <span class="text-base font-black text-slate-900 dark:text-slate-100">${correctCount}/${totalQ}</span>
                            <span class="text-[9px] text-slate-400 block mt-0.5">${Math.round((correctCount/totalQ)*100)}% of Total</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                            <span class="text-[9px] text-rose-500 uppercase font-black block">Incorrect (-2)</span>
                            <span class="text-base font-black text-slate-900 dark:text-slate-100">${wrongCount}/${totalQ}</span>
                            <span class="text-[9px] text-slate-400 block mt-0.5">${Math.round((wrongCount/totalQ)*100)}% of Total</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                            <span class="text-[9px] text-slate-400 uppercase font-black block">Skipped</span>
                            <span class="text-base font-black text-slate-900 dark:text-slate-100">${skippedCount}/${totalQ}</span>
                            <span class="text-[9px] text-slate-400 block mt-0.5">${Math.round((skippedCount/totalQ)*100)}% of Total</span>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-950 p-3 rounded-2xl border border-slate-200 dark:border-slate-800">
                            <span class="text-[9px] text-amber-500 uppercase font-black block">Accuracy</span>
                            <span class="text-base font-black text-slate-900 dark:text-slate-100">${accuracyPct}%</span>
                            <span class="text-[9px] text-slate-400 block mt-0.5">Precision Ratio</span>
                        </div>
                    </div>

                    <!-- AI Opponent Matchmaking Comparison Matrix -->
                    <div class="bg-slate-50 dark:bg-slate-950 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-3">
                        <span class="text-[10px] font-black uppercase tracking-wider text-slate-400 block"><i class="fa-solid fa-users-viewfinder text-rose-500 mr-1"></i> Opponents Leaderboard</span>
                        <div class="space-y-2 text-xs font-bold">
                            <div class="flex justify-between items-center p-2 rounded-xl bg-rose-500/10 border border-rose-500/30">
                                <span class="text-rose-500 font-black"><i class="fa-solid fa-user mr-1"></i> ${currentUserName} (You)</span>
                                <span class="text-rose-500 font-black">${rawScore} pts (${Math.floor(quizOverallSeconds/60)}m)</span>
                            </div>
                            ${AI_BOTS.map(bot => {
                                const botScore = Math.round(totalPossibleScore * bot.scoreFactor);
                                return `
                                    <div class="flex justify-between items-center p-2 rounded-xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300">
                                        <span><i class="fa-solid fa-robot text-slate-400 mr-1"></i> ${bot.name}</span>
                                        <span class="text-slate-400">${botScore} pts (${Math.floor(bot.timeSec/60)}m)</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex space-x-2 pt-2">
                        <button onclick="window.openDetailedSolutionsModal('all')" class="flex-1 bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-2xl text-xs shadow transition"><i class="fa-solid fa-eye mr-1"></i> View Solution</button>
                        <button onclick="window.location.reload()" class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-black py-3 rounded-2xl text-xs shadow transition">Reattempt</button>
                    </div>
                </div>
            `;
        };
                // Interactive View Solution Filter Modal (Green, Red, Black Dots)
        window.openDetailedSolutionsModal = function(filterType) {
            const modal = document.getElementById('solutionModalOverlay');
            const container = document.getElementById('solutionQuestionListNode');
            modal.classList.remove('hidden');

            let html = "";
            challengeQuestions.forEach((q, idx) => {
                const ans = studentAnswersMap[idx];
                let isCorrect = ans && ans.submitted && ans.isCorrect;
                let isIncorrect = ans && ans.submitted && !ans.isCorrect && !ans.expired;
                let isSkipped = !ans || !ans.submitted || ans.expired;

                if(filterType === 'correct' && !isCorrect) return;
                if(filterType === 'incorrect' && !isIncorrect) return;
                if(filterType === 'skipped' && !isSkipped) return;

                let dotColor = "bg-slate-400";
                if(isCorrect) dotColor = "bg-emerald-500";
                if(isIncorrect) dotColor = "bg-rose-500";

                const correctOptKey = q.correctOpt || q.correctOption;

                html += `
                    <div class="bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 space-y-2 text-xs">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full ${dotColor} inline-block"></span>
                            <span class="font-black text-slate-900 dark:text-white">Q${idx+1}: ${q.qText || q.questionText || ''}</span>
                        </div>
                        <p class="text-slate-500 text-[11px]"><b>Your Ans:</b> ${ans && ans.selectedOpt ? ans.selectedOpt : 'Skipped'} | <b>Correct Ans:</b> ${correctOptKey}</p>
                        <div class="bg-slate-50 dark:bg-slate-950 p-2.5 rounded-xl border border-slate-200 dark:border-slate-800 text-[11px] text-slate-600 dark:text-slate-300">
                            <b>NCERT Solution:</b> ${q.solutionText || q.explanation || 'N/A'}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<p class="text-center text-slate-400 text-xs py-10">No questions found for this filter.</p>';
        };

        window.closeSolutionModal = function() {
            document.getElementById('solutionModalOverlay').classList.add('hidden');
        };
    </script>
</head>
