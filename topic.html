<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Topic</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        /* =====================================
           TOPIC PAGE
           ===================================== */

        .topic-page {

            min-height: 100vh;

            padding-bottom: 30px;

        }


        /* =====================================
           HEADER
           ===================================== */

        .topic-header {

            position: sticky;

            top: 0;

            z-index: 50;

            display: flex;

            align-items: center;

            gap: 12px;

            padding: 13px 16px;

            background:
                rgba(4,10,21,0.96);

            backdrop-filter: blur(16px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);

        }


        .topic-back {

            width: 38px;

            height: 38px;

            border: none;

            border-radius: 10px;

            background:
                rgba(255,255,255,0.06);

            color: white;

            font-size: 21px;

            cursor: pointer;

        }


        .brand {

            color: #ffc107;

            font-size: 21px;

            font-weight: 900;

        }


        .brand span {

            color: white;

        }


        /* =====================================
           MAIN
           ===================================== */

        .topic-main {

            width: 100%;

            max-width: 900px;

            margin: auto;

            padding: 20px 15px;

        }


        /* =====================================
           HERO
           ===================================== */

        .topic-hero {

            padding: 21px;

            border-radius: 19px;

            background:
                linear-gradient(
                    145deg,
                    #10213b,
                    #07101f
                );

            border:
                1px solid
                rgba(255,193,7,0.15);

        }


        .topic-label {

            color: #ffc107;

            font-size: 9px;

            font-weight: 900;

            letter-spacing: 1px;

        }


        .topic-title {

            color: white;

            font-size: 24px;

            line-height: 1.25;

            margin: 7px 0;

        }


        .topic-description {

            color: #8997aa;

            font-size: 12px;

            line-height: 1.6;

        }


        /* =====================================
           PRACTICE GRID
           ===================================== */

        .practice-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            margin-top: 15px;

        }


        /* =====================================
           PRACTICE CARD
           ===================================== */

        .practice-card {

            padding: 17px;

            border-radius: 16px;

            background:
                linear-gradient(
                    145deg,
                    #101f35,
                    #0b1628
                );

            border:
                1px solid
                rgba(255,255,255,0.07);

        }


        .practice-icon {

            width: 43px;

            height: 43px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 11px;

            background:
                rgba(255,193,7,0.08);

            font-size: 21px;

            margin-bottom: 11px;

        }


        .practice-title {

            color: white;

            font-size: 15px;

            font-weight: 900;

            margin-bottom: 5px;

        }


        .practice-description {

            color: #8997aa;

            font-size: 11px;

            line-height: 1.5;

            margin-bottom: 13px;

        }


        .practice-button {

            width: 100%;

            min-height: 40px;

            border: none;

            border-radius: 9px;

            background: #ffc107;

            color: #171717;

            font-weight: 900;

            font-size: 11px;

            cursor: pointer;

        }


        .practice-button.notes {

            background: #17263d;

            color: #ffc107;

            border:
                1px solid
                rgba(255,193,7,0.20);

        }


        /* =====================================
           TIP
           ===================================== */

        .quiz-info {

            margin-top: 14px;

            padding: 14px;

            border-radius: 13px;

            background:
                rgba(255,193,7,0.05);

            border:
                1px solid
                rgba(255,193,7,0.11);

            color: #9ba8ba;

            font-size: 11px;

            line-height: 1.6;

        }


        .quiz-info strong {

            color: #ffc107;

        }


        /* =====================================
           LOADING / ERROR
           ===================================== */

        .loading {

            padding: 40px 15px;

            text-align: center;

            color: #8997aa;

            font-size: 12px;

        }


        .error-card {

            padding: 35px 18px;

            text-align: center;

            border-radius: 16px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,255,255,0.06);

        }


        .error-card .icon {

            font-size: 30px;

            margin-bottom: 8px;

        }


        .error-card h3 {

            margin: 0 0 6px;

            color: white;

            font-size: 15px;

        }


        .error-card p {

            margin: 0;

            color: #8997aa;

            font-size: 11px;

        }


        /* =====================================
           MOBILE
           ===================================== */

        @media (max-width: 600px) {

            .practice-grid {

                grid-template-columns: 1fr;

            }


            .topic-main {

                padding:
                    16px 12px;

            }


            .topic-hero {

                padding: 18px;

            }


            .topic-title {

                font-size: 21px;

            }

        }

    </style>

</head>


<body>


<div class="topic-page">


    <!-- HEADER -->

    <header class="topic-header">


        <button
            class="topic-back"
            type="button"
            onclick="goBack()"
        >
            ←
        </button>


        <div class="brand">

            <span>m</span>NEET

        </div>


    </header>



    <!-- MAIN -->

    <main class="topic-main">


        <section class="topic-hero">


            <div class="topic-label">

                NEET BIOLOGY • TOPIC

            </div>


            <h1
                id="topicTitle"
                class="topic-title"
            >

                Loading...

            </h1>


            <div
                id="topicDescription"
                class="topic-description"
            >

                Please wait...

            </div>


        </section>



        <section
            id="practiceGrid"
            class="practice-grid"
        >

            <div class="loading">

                Loading topic...

            </div>

        </section>



        <div class="quiz-info">

            💡

            <strong>
                mNEET Practice Tip:
            </strong>

            First read the topic notes,
            then attempt the quiz and review
            the solution after answering.

        </div>


    </main>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/topic.js"></script>


</body>

</html>
