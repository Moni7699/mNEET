<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Topic</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

</head>


<body>


<div class="student-app">


    <!-- HEADER -->

    <header class="student-header">

        <div class="header-left">

            <button
                class="header-back"
                onclick="goBackToChapter()"
            >
                ←
            </button>

            <div class="brand-logo">
                <span>m</span>NEET
            </div>

        </div>


        <button
            class="header-logout"
            onclick="logoutUser()"
        >
            Logout
        </button>

    </header>



    <!-- MAIN -->

    <main class="student-main">


        <!-- TOPIC HERO -->

        <section class="student-hero">

            <div>

                <div class="hero-small">
                    TOPIC PRACTICE
                </div>

                <h1 id="topicTitle">
                    Loading Topic...
                </h1>

                <p id="topicDescription">
                    Please wait...
                </p>

            </div>


            <div class="hero-icon">
                🧠
            </div>

        </section>



        <!-- QUIZ + NOTES -->

        <div class="section-heading">

            <h2>
                Study & Practice
            </h2>

        </div>


        <section class="quick-grid">


            <!-- QUIZ -->

            <button
                class="quick-card"
                onclick="openTopicQuiz()"
            >

                <span class="quick-icon">
                    📝
                </span>

                <span class="quick-title">
                    Practice Quiz
                </span>

                <span class="quick-text">
                    Test your NEET preparation
                </span>

            </button>



            <!-- NOTES -->

            <button
                class="quick-card"
                onclick="openTopicNotes()"
            >

                <span class="quick-icon">
                    📄
                </span>

                <span class="quick-title">
                    Topic Notes
                </span>

                <span class="quick-text">
                    Read your study material
                </span>

            </button>


        </section>



        <!-- PROGRESS -->

        <section class="progress-card">

            <div class="progress-top">

                <div>

                    <div class="card-label">
                        Topic Progress
                    </div>

                    <div
                        id="topicProgressPercent"
                        class="progress-percent"
                    >
                        0%
                    </div>

                </div>


                <div class="progress-circle">

                    <span
                        id="topicProgressCircle"
                    >
                        0%
                    </span>

                </div>

            </div>


            <div class="progress-bar">

                <div
                    id="topicProgressBar"
                    class="progress-fill"
                    style="width:0%;"
                ></div>

            </div>

        </section>



        <!-- INFORMATION -->

        <div class="section-heading">

            <h2>
                Topic Information
            </h2>

        </div>


        <section class="stats-grid">


            <div class="stat-card">

                <div class="stat-icon">
                    📝
                </div>

                <div>

                    <div class="stat-label">
                        Quiz
                    </div>

                    <div class="stat-value">
                        Ready
                    </div>

                </div>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    📄
                </div>

                <div>

                    <div class="stat-label">
                        Notes
                    </div>

                    <div class="stat-value">
                        PDF
                    </div>

                </div>

            </div>



            <div class="stat-card">

                <div class="stat-icon">
                    🎯
                </div>

                <div>

                    <div class="stat-label">
                        Attempts
                    </div>

                    <div
                        id="attemptCount"
                        class="stat-value"
                    >
                        0
                    </div>

                </div>

            </div>


        </section>


    </main>



    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">


        <button
            class="bottom-item"
            onclick="goBackToStudent()"
        >

            <span>🏠</span>

            <small>
                Home
            </small>

        </button>


        <button
            class="bottom-item active"
            onclick="openTopicQuiz()"
        >

            <span>📝</span>

            <small>
                Quiz
            </small>

        </button>


        <button
            class="bottom-item"
            onclick="openTopicNotes()"
        >

            <span>📄</span>

            <small>
                Notes
            </small>

        </button>


        <button
            class="bottom-item"
            onclick="goBackToChapter()"
        >

            <span>📚</span>

            <small>
                Topics
            </small>

        </button>


    </nav>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/topic.js"></script>


</body>

</html>
