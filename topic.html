<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - Topic</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <style>

        .topic-page {
            min-height: 100vh;
            padding-bottom: 30px;
        }

        .topic-header {
            position: sticky;
            top: 0;
            z-index: 30;

            display: flex;
            align-items: center;
            gap: 14px;

            padding: 14px 17px;

            background:
                rgba(4,10,21,0.96);

            backdrop-filter: blur(15px);

            border-bottom:
                1px solid
                rgba(255,255,255,0.07);
        }

        .topic-back {
            border: none;
            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }

        .brand {
            color: #ffc107;

            font-size: 21px;

            font-weight: 900;
        }

        .brand span {
            color: white;
        }

        .topic-main {
            width: 100%;
            max-width: 900px;

            margin: auto;

            padding: 22px 15px;
        }

        .topic-hero {
            padding: 24px 20px;

            border-radius: 20px;

            background:
                linear-gradient(
                    145deg,
                    #10213b,
                    #07101f
                );

            border:
                1px solid
                rgba(255,193,7,0.16);
        }

        .topic-label {
            color: #ffc107;

            font-size: 10px;

            font-weight: 900;

            letter-spacing: 1px;
        }

        .topic-title {
            color: white;

            font-size: 25px;

            margin: 7px 0;
        }

        .topic-description {
            color: #8e9bae;

            font-size: 13px;

            line-height: 1.6;
        }

        .practice-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 14px;

            margin-top: 20px;
        }

        .practice-card {
            padding: 20px;

            border-radius: 18px;

            background: #0d192c;

            border:
                1px solid
                rgba(255,255,255,0.07);

            transition: 0.2s;
        }

        .practice-card:hover {
            transform:
                translateY(-2px);

            border-color:
                rgba(255,193,7,0.25);
        }

        .practice-icon {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            background:
                rgba(255,193,7,0.08);

            font-size: 24px;

            margin-bottom: 14px;
        }

        .practice-title {
            color: white;

            font-size: 16px;

            font-weight: 900;

            margin-bottom: 6px;
        }

        .practice-description {
            color: #8997aa;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 16px;
        }

        .practice-button {
            width: 100%;

            min-height: 43px;

            border: none;

            border-radius: 10px;

            background: #ffc107;

            color: #171717;

            font-weight: 900;

            cursor: pointer;
        }

        .practice-button.notes {
            background: #17263d;

            color: #ffc107;

            border:
                1px solid
                rgba(255,193,7,0.20);
        }

        .quiz-info {
            margin-top: 18px;

            padding: 17px;

            border-radius: 15px;

            background:
                rgba(255,193,7,0.05);

            border:
                1px solid
                rgba(255,193,7,0.12);

            color: #9ba8ba;

            font-size: 12px;

            line-height: 1.7;
        }

        .loading {
            text-align: center;

            color: #8997aa;

            padding: 40px;
        }

        @media (max-width: 600px) {

            .practice-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<div class="topic-page">


    <header class="topic-header">

        <button
            class="topic-back"
            onclick="goBack()"
        >
            ←
        </button>

        <div class="brand">
            <span>m</span>NEET
        </div>

    </header>



    <main class="topic-main">


        <section class="topic-hero">

            <div class="topic-label">
                NEET BIOLOGY • TOPIC
            </div>

            <h1
                id="topicTitle"
                class="topic-title"
            >
                Loading...
            </h1>

            <div
                id="topicDescription"
                class="topic-description"
            >
                Please wait...
            </div>

        </section>



        <section
            id="practiceGrid"
            class="practice-grid"
        >

            <div class="loading">
                Loading topic...
            </div>

        </section>



        <div class="quiz-info">

            💡 <strong>mNEET Practice Tip:</strong>

            First read the topic notes carefully,
            then attempt the quiz.

            After submitting each answer,
            review the solution and NCERT reference.

        </div>


    </main>


</div>


<script src="js/firebase.js"></script>

<script src="js/auth.js"></script>

<script src="js/topic.js"></script>


</body>

</html>
