<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>mNEET - NCERT Reading</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f9;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            color: #17221a;
        }

        .ncert-app {
            min-height: 100vh;
            padding-bottom: 85px;
        }

        .ncert-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: #1b5e20;
            color: #fff;
            padding: 14px 16px;
            box-shadow:
                0 3px 12px rgba(0,0,0,.15);
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            max-width: 1100px;
            margin: auto;
        }

        .back-button {
            border: 0;
            background: rgba(255,255,255,.14);
            color: #fff;
            border-radius: 10px;
            padding: 10px 13px;
            font-weight: 800;
            cursor: pointer;
        }

        .header-title {
            flex: 1;
        }

        .header-title strong {
            display: block;
            font-size: 20px;
        }

        .header-title span {
            display: block;
            font-size: 12px;
            opacity: .85;
            margin-top: 3px;
        }

        .ncert-main {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            padding: 18px 14px;
        }

        .hero {
            background:
                linear-gradient(
                    135deg,
                    #1b5e20,
                    #2e7d32
                );
            color: #fff;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 18px;
            box-shadow:
                0 8px 24px rgba(27,94,32,.20);
        }

        .hero-small {
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 1px;
            opacity: .85;
        }

        .hero h1 {
            margin: 7px 0;
            font-size: 28px;
        }

        .hero p {
            margin: 0;
            line-height: 1.5;
            opacity: .92;
        }

        .course-info {
            background: #fff;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow:
                0 3px 14px rgba(0,0,0,.07);
        }

        .course-name {
            font-size: 19px;
            font-weight: 900;
        }

        .course-path {
            margin-top: 5px;
            color: #66736a;
            font-size: 13px;
        }

        .search-box {
            margin: 16px 0;
        }

        .search-box input {
            width: 100%;
            border: 1px solid #d7ddd8;
            background: #fff;
            border-radius: 13px;
            padding: 14px 15px;
            outline: none;
            font-size: 15px;
        }

        .search-box input:focus {
            border-color: #2e7d32;
            box-shadow:
                0 0 0 3px rgba(46,125,50,.10);
        }

        .section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin: 18px 2px 10px;
        }

        .section-title h2 {
            margin: 0;
            font-size: 21px;
        }

        .count {
            font-size: 12px;
            font-weight: 800;
            color: #66736a;
        }

        .chapter-list {
            display: grid;
            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(280px, 1fr)
                );
            gap: 13px;
        }

        .chapter-card {
            background: #fff;
            border-radius: 17px;
            padding: 16px;
            border: 1px solid #e3e8e4;
            box-shadow:
                0 4px 15px rgba(0,0,0,.06);
        }

        .chapter-top {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .chapter-number {
            min-width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #e8f5e9;
            color: #1b5e20;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        .chapter-name {
            font-size: 16px;
            font-weight: 900;
            line-height: 1.35;
        }

        .chapter-meta {
            margin-top: 4px;
            color: #718078;
            font-size: 12px;
        }

        .chapter-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
            margin-top: 14px;
        }

        .ncert-button {
            border: 0;
            border-radius: 11px;
            padding: 11px 8px;
            font-weight: 900;
            cursor: pointer;
            background: #1b5e20;
            color: #fff;
        }

        .pyq-button {
            background: #f1f5f2;
            color: #1b5e20;
            border: 1px solid #cfd9d1;
        }

        .empty-box,
        .loading-box,
        .error-box {
            background: #fff;
            border-radius: 16px;
            padding: 30px 18px;
            text-align: center;
            color: #68756c;
            box-shadow:
                0 3px 14px rgba(0,0,0,.06);
        }

        .error-box {
            color: #b3261e;
        }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 200;
            height: 70px;
            background: #fff;
            border-top: 1px solid #e1e5e2;
            display: flex;
            justify-content: center;
            box-shadow:
                0 -4px 15px rgba(0,0,0,.08);
        }

        .bottom-nav button {
            flex: 1;
            max-width: 150px;
            border: 0;
            background: transparent;
            color: #68756c;
            font-weight: 800;
            cursor: pointer;
        }

        .bottom-nav button.active {
            color: #1b5e20;
        }

        .bottom-nav span {
            display: block;
            font-size: 20px;
        }

        .bottom-nav small {
            display: block;
            margin-top: 3px;
        }

        @media (max-width: 600px) {

            .hero h1 {
                font-size: 24px;
            }

            .chapter-list {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

<div class="ncert-app">


    <!-- HEADER -->

    <header class="ncert-header">

        <div class="header-row">

            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ← Back
            </button>

            <div class="header-title">

                <strong>NCERT Reading</strong>

                <span>
                    Chapter-wise Biology NCERT
                </span>

            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="ncert-main">


        <section class="hero">

            <div class="hero-small">
                mNEET • NEET BIOLOGY
            </div>

            <h1>
                NCERT Books
            </h1>

            <p>
                Read chapter-wise NCERT books
                and practice PYQs from the same
                chapter.
            </p>

        </section>


        <!-- COURSE -->

        <section
            id="courseInfo"
            class="course-info"
        >

            <div class="course-name">
                Loading course...
            </div>

            <div class="course-path">
                Please wait
            </div>

        </section>


        <!-- SEARCH -->

        <div class="search-box">

            <input
                id="chapterSearch"
                type="search"
                placeholder="Search chapter..."
                autocomplete="off"
            >

        </div>


        <!-- CHAPTER TITLE -->

        <div class="section-title">

            <h2>
                Biology Chapters
            </h2>

            <span
                id="chapterCount"
                class="count"
            >
                0 Chapters
            </span>

        </div>


        <!-- CHAPTER LIST -->

        <section
            id="chapterList"
            class="chapter-list"
        >

            <div class="loading-box">

                Loading chapters...

            </div>

        </section>


    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            type="button"
            onclick="goHome()"
        >

            <span>🏠</span>

            <small>Home</small>

        </button>


        <button
            type="button"
            onclick="openPractice()"
        >

            <span>📝</span>

            <small>Practice</small>

        </button>


        <button
            type="button"
            class="active"
            onclick="goTop()"
        >

            <span>📖</span>

            <small>NCERT</small>

        </button>


        <button
            type="button"
            onclick="openProfile()"
        >

            <span>👤</span>

            <small>Profile</small>

        </button>

    </nav>

</div>


<!-- FIREBASE -->

<script src="js/firebase.js"></script>


<!-- AUTH -->

<script src="js/auth.js"></script>


<!-- NCERT -->

<script src="js/ncert.js"></script>


</body>

</html>
