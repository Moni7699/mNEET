<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#1b5e20"
    >

    <title>mNEET - NCERT Reading</title>


    <!-- ==================================================
         FIREBASE COMPAT
         ================================================== -->

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore-compat.js"></script>

    <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-storage-compat.js"></script>


    <style>

        /* ==================================================
           RESET
           ================================================== */

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            margin: 0;

            background: #f4f6f9;

            color: #17221a;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            min-height: 100vh;

        }


        button,
        input {

            font-family: inherit;

        }


        button {

            cursor: pointer;

        }


        /* ==================================================
           APP
           ================================================== */

        .ncert-app {

            min-height: 100vh;

            padding-bottom: 86px;

        }


        /* ==================================================
           HEADER
           ================================================== */

        .ncert-header {

            position: sticky;

            top: 0;

            z-index: 1000;

            background: #1b5e20;

            color: #ffffff;

            padding: 13px 15px;

            box-shadow:
                0 4px 16px rgba(0, 0, 0, .16);

        }


        .header-row {

            width: 100%;

            max-width: 1150px;

            margin: auto;

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .back-button {

            border: 0;

            background:
                rgba(255, 255, 255, .14);

            color: #ffffff;

            border-radius: 11px;

            padding: 10px 13px;

            font-size: 14px;

            font-weight: 900;

            white-space: nowrap;

        }


        .back-button:active {

            transform: scale(.97);

        }


        .header-title {

            min-width: 0;

            flex: 1;

        }


        .header-title strong {

            display: block;

            font-size: 20px;

            line-height: 1.2;

        }


        .header-title span {

            display: block;

            margin-top: 3px;

            font-size: 11px;

            opacity: .82;

        }


        /* ==================================================
           MAIN
           ================================================== */

        .ncert-main {

            width: 100%;

            max-width: 1150px;

            margin: auto;

            padding: 18px 14px 25px;

        }


        /* ==================================================
           HERO
           ================================================== */

        .hero {

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #1b5e20 0%,
                    #2e7d32 55%,
                    #388e3c 100%
                );

            color: #ffffff;

            border-radius: 21px;

            padding: 25px 21px;

            margin-bottom: 17px;

            box-shadow:
                0 9px 27px rgba(27, 94, 32, .22);

        }


        .hero::after {

            content: "";

            position: absolute;

            width: 150px;

            height: 150px;

            right: -45px;

            top: -55px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, .08);

        }


        .hero-small {

            position: relative;

            z-index: 2;

            font-size: 11px;

            font-weight: 900;

            letter-spacing: 1.3px;

            opacity: .86;

        }


        .hero h1 {

            position: relative;

            z-index: 2;

            margin: 7px 0 6px;

            font-size: 28px;

            line-height: 1.2;

        }


        .hero p {

            position: relative;

            z-index: 2;

            margin: 0;

            max-width: 700px;

            line-height: 1.55;

            font-size: 14px;

            opacity: .93;

        }


        /* ==================================================
           COURSE INFO
           ================================================== */

        .course-info {

            background: #ffffff;

            border-radius: 16px;

            padding: 16px;

            margin-bottom: 15px;

            border: 1px solid #e2e8e3;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .055);

        }


        .course-name {

            font-size: 19px;

            font-weight: 900;

            color: #17221a;

        }


        .course-path {

            margin-top: 5px;

            font-size: 13px;

            color: #69766e;

            line-height: 1.45;

        }


        /* ==================================================
           SEARCH
           ================================================== */

        .search-box {

            position: relative;

            margin: 15px 0 18px;

        }


        .search-icon {

            position: absolute;

            left: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            pointer-events: none;

        }


        .search-box input {

            width: 100%;

            height: 49px;

            border: 1px solid #d5ddd7;

            background: #ffffff;

            color: #17221a;

            border-radius: 14px;

            padding:
                0 15px 0 44px;

            outline: none;

            font-size: 15px;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, .035);

        }


        .search-box input::placeholder {

            color: #8a948e;

        }


        .search-box input:focus {

            border-color: #2e7d32;

            box-shadow:
                0 0 0 3px rgba(46, 125, 50, .11);

        }


        /* ==================================================
           SECTION TITLE
           ================================================== */

        .section-title {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 10px;

            margin:
                0 2px 11px;

        }


        .section-title h2 {

            margin: 0;

            font-size: 21px;

            color: #17221a;

        }


        .count {

            flex-shrink: 0;

            background: #e8f5e9;

            color: #1b5e20;

            border-radius: 20px;

            padding: 6px 10px;

            font-size: 11px;

            font-weight: 900;

        }


        /* ==================================================
           CHAPTER GRID
           ================================================== */

        .chapter-list {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(285px, 1fr)
                );

            gap: 13px;

        }


        /* ==================================================
           CHAPTER CARD
           ================================================== */

        .chapter-card {

            background: #ffffff;

            border: 1px solid #e1e7e2;

            border-radius: 18px;

            padding: 16px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .055);

            transition:
                transform .18s ease,
                box-shadow .18s ease;

        }


        .chapter-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 22px rgba(0, 0, 0, .08);

        }


        .chapter-top {

            display: flex;

            align-items: flex-start;

            gap: 12px;

            min-height: 54px;

        }


        .chapter-number {

            flex-shrink: 0;

            width: 44px;

            height: 44px;

            border-radius: 13px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #e8f5e9;

            color: #1b5e20;

            font-size: 16px;

            font-weight: 900;

        }


        .chapter-content {

            min-width: 0;

            flex: 1;

        }


        .chapter-name {

            font-size: 16px;

            font-weight: 900;

            line-height: 1.35;

            color: #17221a;

            word-break: break-word;

        }


        .chapter-meta {

            margin-top: 5px;

            color: #718078;

            font-size: 12px;

            line-height: 1.4;

        }


        /* ==================================================
           PDF BUTTONS
           ================================================== */

        .chapter-buttons {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 9px;

            margin-top: 15px;

        }


        .pdf-button {

            min-height: 43px;

            border: 0;

            border-radius: 11px;

            padding: 10px 8px;

            font-size: 13px;

            font-weight: 900;

            transition:
                transform .12s ease,
                opacity .12s ease;

        }


        .pdf-button:active {

            transform: scale(.97);

        }


        .ncert-button {

            background: #1b5e20;

            color: #ffffff;

        }


        .ncert-button:hover {

            background: #15551a;

        }


        .pyq-button {

            background: #f1f6f2;

            color: #1b5e20;

            border: 1px solid #cfdad1;

        }


        .pyq-button:hover {

            background: #e6f1e7;

        }


        /* ==================================================
           EMPTY / ERROR / LOADING
           ================================================== */

        .state-box {

            grid-column: 1 / -1;

            background: #ffffff;

            border-radius: 17px;

            padding: 34px 18px;

            text-align: center;

            border: 1px solid #e1e7e2;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, .05);

        }


        .state-icon {

            font-size: 34px;

            margin-bottom: 8px;

        }


        .state-title {

            font-size: 17px;

            font-weight: 900;

            color: #253129;

        }


        .state-text {

            margin-top: 7px;

            color: #718078;

            font-size: 13px;

            line-height: 1.5;

        }


        .retry-button {

            margin-top: 15px;

            border: 0;

            border-radius: 11px;

            padding: 11px 17px;

            background: #1b5e20;

            color: #ffffff;

            font-weight: 900;

        }


        /* ==================================================
           BOTTOM NAV
           ================================================== */

        .bottom-nav {

            position: fixed;

            left: 0;

            right: 0;

            bottom: 0;

            z-index: 2000;

            height: 70px;

            background: #ffffff;

            border-top: 1px solid #e0e6e1;

            display: flex;

            justify-content: center;

            box-shadow:
                0 -4px 16px rgba(0, 0, 0, .08);

        }


        .bottom-nav button {

            width: 25%;

            max-width: 155px;

            border: 0;

            background: transparent;

            color: #758078;

            font-weight: 800;

            padding: 5px 3px;

        }


        .bottom-nav button.active {

            color: #1b5e20;

        }


        .bottom-nav span {

            display: block;

            font-size: 20px;

            line-height: 23px;

        }


        .bottom-nav small {

            display: block;

            margin-top: 2px;

            font-size: 10px;

        }


        /* ==================================================
           TOAST
           ================================================== */

        .toast {

            position: fixed;

            left: 50%;

            bottom: 82px;

            transform:
                translate(-50%, 15px);

            z-index: 3000;

            width: max-content;

            max-width: calc(100% - 30px);

            background: #26342a;

            color: #ffffff;

            border-radius: 12px;

            padding: 11px 15px;

            font-size: 13px;

            font-weight: 800;

            opacity: 0;

            pointer-events: none;

            transition:
                opacity .2s ease,
                transform .2s ease;

            text-align: center;

        }


        .toast.show {

            opacity: 1;

            transform:
                translate(-50%, 0);

        }


        /* ==================================================
           DESKTOP
           ================================================== */

        @media (min-width: 800px) {

            .ncert-main {

                padding-top: 25px;

            }


            .hero {

                padding: 30px 27px;

            }


            .hero h1 {

                font-size: 31px;

            }


            .chapter-list {

                gap: 15px;

            }

        }


        /* ==================================================
           MOBILE
           ================================================== */

        @media (max-width: 600px) {

            .ncert-main {

                padding:
                    14px 11px 22px;

            }


            .hero {

                border-radius: 18px;

                padding: 21px 17px;

            }


            .hero h1 {

                font-size: 24px;

            }


            .hero p {

                font-size: 13px;

            }


            .chapter-list {

                grid-template-columns: 1fr;

            }


            .chapter-card {

                border-radius: 16px;

            }


            .header-title strong {

                font-size: 18px;

            }

        }

    </style>

</head>


<body>


<div class="ncert-app">


    <!-- ==================================================
         HEADER
         ================================================== -->

    <header class="ncert-header">

        <div class="header-row">

            <button
                type="button"
                class="back-button"
                onclick="goBack()"
            >
                ← Back
            </button>


            <div class="header-title">

                <strong>
                    NCERT Reading
                </strong>

                <span>
                    Chapter-wise Biology NCERT
                </span>

            </div>

        </div>

    </header>


    <!-- ==================================================
         MAIN
         ================================================== -->

    <main class="ncert-main">


        <!-- HERO -->

        <section class="hero">

            <div class="hero-small">
                mNEET • NEET BIOLOGY
            </div>


            <h1>
                NCERT Books
            </h1>


            <p>
                Read chapter-wise NCERT Biology
                and practice PYQs from the same
                chapter.
            </p>

        </section>


        <!-- COURSE -->

        <section
            id="courseInfo"
            class="course-info"
        >

            <div class="course-name">
                Loading course...
            </div>

            <div class="course-path">
                Please wait...
            </div>

        </section>


        <!-- SEARCH -->

        <div class="search-box">

            <span class="search-icon">
                🔍
            </span>


            <input
                id="chapterSearch"
                type="search"
                placeholder="Search chapter or chapter number..."
                autocomplete="off"
                spellcheck="false"
            >

        </div>


        <!-- TITLE -->

        <div class="section-title">

            <h2>
                Biology Chapters
            </h2>


            <span
                id="chapterCount"
                class="count"
            >
                0 Chapters
            </span>

        </div>


        <!-- CHAPTERS -->

        <section
            id="chapterList"
            class="chapter-list"
        >

            <div class="state-box">

                <div class="state-icon">
                    ⏳
                </div>

                <div class="state-title">
                    Loading chapters...
                </div>

                <div class="state-text">
                    Please wait while NCERT chapters
                    are being loaded.
                </div>

            </div>

        </section>


    </main>


    <!-- ==================================================
         BOTTOM NAVIGATION
         ================================================== -->

    <nav class="bottom-nav">


        <button
            type="button"
            onclick="goHome()"
        >

            <span>
                🏠
            </span>

            <small>
                Home
            </small>

        </button>


        <button
            type="button"
            onclick="openPractice()"
        >

            <span>
                📝
            </span>

            <small>
                Practice
            </small>

        </button>


        <button
            type="button"
            class="active"
            onclick="goTop()"
        >

            <span>
                📖
            </span>

            <small>
                NCERT
            </small>

        </button>


        <button
            type="button"
            onclick="openProfile()"
        >

            <span>
                👤
            </span>

            <small>
                Profile
            </small>

        </button>


    </nav>


</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast"
></div>


<!-- ==================================================
     YOUR FIREBASE CONFIG
     ================================================== -->

<script src="js/firebase.js"></script>


<!-- AUTH -->

<script src="js/auth.js"></script>


<!-- NCERT -->

<script src="js/ncert.js"></script>


</body>

</html>
